  </div>
  <div class="gate" id="gate" hidden>
    <div class="gate-box">
      <div style="font-size:44px">🎧</div>
      <h3>방에 들어왔어요</h3>
      <p class="hint" style="margin-bottom:16px">브라우저가 소리를 막지 않도록 한 번 눌러 주세요</p>
      <button class="btn" id="gateBtn">🔊 소리 켜고 입장하기</button>
    </div>
  </div>`;

  $("#copy").onclick = async () => {
    const link = location.href.split("#")[0] + "#/room/" + code;
    try { await navigator.clipboard.writeText(link); toast("초대 링크를 복사했어요"); }
    catch { prompt("이 링크를 복사해서 보내 주세요", link); }
  };

  // 재생 오류 기록: 문제 데이터의 그 곡에 오류 번호·횟수·시각을 남김 (편집 화면에 ⚠ 로 보임)
  const loggedErr = new Set();
  function logPlayError(e) {
    try {
      const code = e?.data;
      if (location.protocol === "file:" || code == null) return;
      const song = (room?.songs || []).find(x => x.videoId === curVideo) || room?.songs?.[room?.state?.index];
      const pid = room?.settings?.playlistId;
      if (!song?.sid || !pid) return;
      const k = song.sid + "|" + code;
      if (loggedErr.has(k)) return;   // 같은 곡 같은 오류는 이 방에서 한 번만
      loggedErr.add(k);
      runTransaction(ref(db, `playlistSongs/${pid}/${song.sid}/err`), v => {
        if (v && v.videoId && v.videoId !== song.videoId) v = null;   // 영상이 바뀌었으면 새로 셈
        return { videoId: song.videoId, code, count: (v?.count || 0) + 1, at: Date.now(), ua: /Mobi/i.test(navigator.userAgent) ? "mobile" : "pc" };
      }).catch(console.error);
    } catch (err) { console.error(err); }
  }

  // ----- 플레이어 -----
  let room = null;
  let curVideo = null;
  // 곡마다 1×1px 플레이어를 새로 만들어서 씀 (처음부터 아주 작은 플레이어로 불러와야 광고가 잘 안 붙음)
  const onPlayErr = e => { toast(ytErrorText(e) + " · 스킵 투표로 넘어갈 수 있어요"); logPlayError(e); markReady(); };
  let playerGen = 0;
  let inAd = false, adWatch = null, frozen = 0, lastT = null;
  let ytSeq = 0;
  // 플레이어 칸 하나 만들기 (bg = 다음 곡을 미리 틀어 두는 숨은 플레이어)
  async function makePlayer(onError, bg) {
    const box = $("#ytBox");
    const div = document.createElement("div");
    div.id = "yt" + ++ytSeq;
    box.prepend(div);
    const p = await createPlayer(div.id, { tiny: true, onError });
    try { p.getIframe().classList.toggle("bg", !!bg); } catch {}
    return p;
  }
  async function freshPlayer() {
    const gen = ++playerGen;
    try { player && player.destroy(); } catch {}
    player = null;
    const p = await makePlayer(e => onPlayErr(e), false);
    if (gen !== playerGen || my !== viewId) { try { p.destroy(); } catch {} return null; }
    player = p;
    resetAd();
    return p;
  }
  // ----- 다음 곡 미리 틀어 두기 -----
  // 지금 곡을 듣는 동안 다음 곡을 숨은 플레이어에서 소리 없이 미리 재생해 둠
  // → 광고가 붙어도 지금 곡 시간 동안 조용히 지나가서, 다음 곡은 기다림 없이 바로 시작
  let pre = null;
  async function prefetch(i) {
    const song = room?.songs?.[i];
    if (!song || (pre && pre.videoId === song.videoId)) return;
    try { pre && pre.p && pre.p.destroy(); } catch {}
    const slot = { videoId: song.videoId, p: null, err: false };
    pre = slot;
    const p = await makePlayer(() => { slot.err = true; }, true);
    if (pre !== slot || my !== viewId) { try { p.destroy(); } catch {} return; }
    slot.p = p;
    p.mute();
    p.loadVideoById({ videoId: song.videoId, startSeconds: song.start || 0 });
  }
  // 미리 틀어 둔 플레이어가 있으면 그걸 지금 플레이어로 씀
  function adoptPre(song) {
    if (!pre || pre.videoId !== song.videoId || !pre.p || pre.err) return null;
    playerGen++;
    try { player && player.destroy(); } catch {}
    player = pre.p;
    pre = null;
    try { player.getIframe().classList.remove("bg"); } catch {}
    resetAd();
    return player;
  }
  let player = null;
  $("#ytBox").classList.add("tiny");
  await freshPlayer();
  if (my !== viewId) { try { player && player.destroy(); } catch {} return; }
  onCleanup(() => { playerGen++; try { player && player.destroy(); } catch {} try { pre && pre.p && pre.p.destroy(); } catch {} pre = null; });

  // 링크로 바로 들어와서 아직 페이지를 한 번도 누르지 않았다면, 브라우저가 소리를 막으므로 한 번 누르게 함
  if (navigator.userActivation && !navigator.userActivation.hasBeenActive) $("#gate").hidden = false;
  $("#gateBtn").onclick = () => {
    $("#gate").hidden = true;
    resync(true);
  };

  const vol = () => +(localStorage.getItem("vol") ?? 80);
  $("#vol").value = vol();
  $("#vol").addEventListener("input", e => {
    localStorage.setItem("vol", e.target.value);
    try { player.setVolume(+e.target.value); if (+e.target.value > 0) player.unMute(); } catch {}
  });

  let startT = null, stopT = null, checkT = null, segT = null;
  const clearPlayTimers = () => { clearTimeout(startT); clearTimeout(stopT); clearTimeout(checkT); clearTimeout(segT); };
  // 구간 정보 {시작, 길이(ms), 반복 간격(ms)}
  // - 끝 지점을 정한 곡: 그 구간을 반복 (반복 간격을 비우면 기본 2초)
  // - 끝 지점이 없어도 영상이 문제 시간보다 짧으면: 영상 끝까지를 구간으로 보고 반복
  const DEFAULT_GAP = 2000;
  const segOf = song => {
    const a = song.start || 0;
    const gap = song.gap > 0 ? song.gap * 1000 : DEFAULT_GAP;
    if (song.end > a) return { a, len: (song.end - a) * 1000, gap };
    let d = song.len || 0;
    if (!d) { try { d = player.getDuration() || 0; } catch {} }
    const rest = (d - a) * 1000 - 300;   // 영상 맨 끝(추천 영상 화면)에 닿지 않게 0.3초 남김
    if (d > 0 && rest > 500 && rest < clipMs()) return { a, len: rest, gap };
    return null;
  };
  onCleanup(clearPlayTimers);

  // 곡당 시간: clipLen 0 = 무제한 (스킵으로만 넘어감)
  const isUnlimited = () => room?.settings?.clipLen === 0;
  const clipMs = () => (isUnlimited() ? Infinity : (room?.settings?.clipLen || 30) * 1000);
  // 힌트 시점: 보통은 1/3, 2/3 지점. 무제한이면 방장이 정한 시간 (기본 15초, 30초)
  const hintSecs = () => {
    const s = room?.settings || {};
    const h1 = s.hint1 > 0 ? s.hint1 : 15;
    const h2 = s.hint2 > 0 ? Math.max(s.hint2, h1) : Math.max(30, h1);
    return [h1, h2];
  };
  const hintAt = () => (isUnlimited() ? hintSecs().map(x => x * 1000) : [clipMs() / 3, (clipMs() * 2) / 3]);
  const later = (fn, ms) => (Number.isFinite(ms) ? setTimeout(fn, ms) : null);   // 무제한일 때 setTimeout(Infinity)가 바로 실행되는 것 방지
  const startOf = song => {
    let d = 0;
    try { d = player.getDuration() || 0; } catch {}
    return pickStart(song, room?.settings?.startMode || "auto", d);
  };

  // 재생이 실제로 시작됐는지 확인하고, 막혔으면 버튼을 띄움
  function checkSound(minLen = Infinity) {
    clearTimeout(checkT);
    if (minLen < 2000) return;   // 아주 짧은 구간은 검사하지 않음 (이미 멈춘 상태라 오탐)
    checkT = setTimeout(() => {
      try {
        const st = room?.state || {};
        if (st.phase !== "playing" || now() > st.startAt + clipMs()) return;
        if (inAd) return;
        const blocked = player.isMuted() || player.getPlayerState() !== YT.PlayerState.PLAYING;
        $("#soundAlert").hidden = !blocked;
      } catch {}
    }, 1500);
  }

  // startAt 기준 지금 몇 ms 지났는지 보고 그 위치부터 재생 (모든 참가자가 같은 순간을 들음)
  function playFrom(song, startAt) {
    const clip = clipMs();
    const el = Math.max(0, now() - startAt);
    clearTimeout(stopT); clearTimeout(segT);
    if (el >= clip) { try { player.pauseVideo(); } catch {} return; }
    if (inAd) return;   // 광고가 끝나면 setAd(false)가 다시 불러 줌
    player.unMute();
    player.setVolume(vol());
    const seg = segOf(song);
    if (!seg) {
      player.seekTo(startOf(song) + el / 1000, true);
      player.playVideo();
      stopT = later(() => { try { player.pauseVideo(); } catch {} }, clip - el);
      checkSound();
      return;
    }
    // 구간 반복: (구간 길이 + 쉬는 시간)마다 한 번씩
    const period = seg.len + seg.gap;
    const cyc = Math.floor(el / period);
    const pos = el - cyc * period;
    if (pos < seg.len) {
      player.seekTo(seg.a + pos / 1000, true);
      player.playVideo();
      stopT = later(() => { try { player.pauseVideo(); } catch {} }, Math.min(seg.len - pos, clip - el));
      checkSound(seg.len - pos);
    } else {
      try { player.pauseVideo(); } catch {}
    }
    if ((cyc + 1) * period < clip) {
      segT = setTimeout(() => playFrom(song, startAt), (cyc + 1) * period - el);
    }
  }

  async function schedulePlay(song, startAt, key) {
    if (now() - startAt >= clipMs()) { try { player.stopVideo(); } catch {} return; }
    // 새 1×1 플레이어를 만들고, 카운트다운 동안 음소거 상태로 미리 불러와 둠
    curVideo = null;
    let p = adoptPre(song);
    if (p) { p.mute(); curVideo = song.videoId; }
    else {
      p = await freshPlayer();
      if (!p || key !== lastKey) return;
      p.mute();
      p.loadVideoById({ videoId: song.videoId, startSeconds: startOf(song) });
      curVideo = song.videoId;
    }
    armStart();
    prefetch(room.state.index + 1).catch(console.error);   // 이미 모두 준비된 상태(늦게 들어온 경우 등)면 바로 예약
  }

  function playReveal(song) {
    const s = startOf(song);
    if (curVideo === song.videoId) player.seekTo(s, true);
    else { player.loadVideoById({ videoId: song.videoId, startSeconds: s }); curVideo = song.videoId; }
    if (inAd) { $("#adShield").hidden = false; return; }
    player.unMute();
    player.setVolume(vol());
    player.playVideo();
    const seg = segOf(song);   // 구간 문제는 정답 공개 때도 그 구간만 한 번
    if (seg) stopT = setTimeout(() => { try { player.pauseVideo(); } catch {} }, seg.len);
  }

  // ----- 광고 감지 -----
  // YouTube API는 광고 여부를 알려 주지 않아서, "재생 중인데 본 영상 시간이 멈춰 있으면 광고"로 판단함
  function setAd(on) {
    if (on === inAd) return;
    inAd = on;
    const st = room?.state || {};
    $("#adNote").hidden = !(on && st.phase === "playing" && !st.wait);
    $("#adShield").hidden = !(on && st.phase === "reveal");
    if (on) { try { player.mute(); } catch {} $("#soundAlert").hidden = true; return; }
    // 광고 끝 → 지금 시점에 맞춰 이어서 재생
    const song = room?.songs?.[st.index];
    try {
      if (st.phase === "playing" && song && now() >= st.startAt) playFrom(song, st.startAt);
      else if (st.phase === "reveal" && song) { player.seekTo(startOf(song), true); player.unMute(); player.setVolume(vol()); player.playVideo(); }
    } catch (e) { console.error(e); }
  }
  function resetAd() {   // 새 플레이어를 만들 때: 이전 광고 상태는 버림
    inAd = false;
    $("#adNote").hidden = true;
    $("#adShield").hidden = true;
  }
  function watchAds() {
    clearInterval(adWatch);
    frozen = 0; lastT = null;
    const ph = room?.state?.phase;
    $("#adNote").hidden = !(inAd && ph === "playing" && !room?.state?.wait);
    $("#adShield").hidden = !(inAd && ph === "reveal");
    adWatch = setInterval(() => {
      const st = room?.state || {};
      if (st.phase !== "playing" && st.phase !== "reveal") return;
      let state, t;
      try { state = player.getPlayerState(); t = player.getCurrentTime(); } catch { return; }
      const song = room?.songs?.[st.index];
      let vid = null;
      try { vid = player.getVideoData()?.video_id; } catch {}
      const otherVideo = !!(vid && song && vid !== song.videoId);   // 광고 영상이 재생 중
      const advancing = lastT !== null && Math.abs(t - lastT) >= 0.05;
      if (state === YT.PlayerState.PLAYING && (otherVideo || (lastT !== null && !advancing))) frozen++;
      else if (state === YT.PlayerState.PLAYING) frozen = 0;
      lastT = t;
      // 대기 중: 진짜 노래가 1초 가까이 흐르면 준비 완료
      if (st.phase === "playing" && st.wait) {
        goodTicks = state === YT.PlayerState.PLAYING && advancing && !otherVideo && !inAd ? goodTicks + 1 : 0;
        if (goodTicks >= 2) markReady();
      }
      if (!inAd && frozen >= 3) setAd(true);          // 약 1초 동안 시간이 안 흐르면 광고
      else if (inAd && frozen === 0 && state === YT.PlayerState.PLAYING) setAd(false);
    }, 350);
  }
  onCleanup(() => clearInterval(adWatch));

  // ----- 모두 준비될 때까지 기다리기 -----
  // 각자 영상을 소리 없이 미리 틀어 보고, 광고가 아니라 진짜 노래가 흐르기 시작하면 "준비됨"을 보냄
  let readySent = null, goodTicks = 0;
  function markReady() {
    const st = room?.state || {};
    if (st.phase !== "playing" || !st.wait || readySent === st.playId) return;
    readySent = st.playId;
    set(ref(db, `${base}/ready/${uid}`), st.playId).catch(console.error);
  }
  const notReady = st => onlineIds().filter(id => (room.ready || {})[id] !== st.playId);
  let goTry = "", goTryAt = 0;
  function tryGo() {
    const st = room?.state || {};
    if (st.phase !== "playing" || !st.wait) return;
    const all = notReady(st).length === 0;
    const timeout = now() >= (st.waitSince || 0) + WAIT_MAX;
    if (!all && !timeout) return;
    if (goTry === st.playId && Date.now() - goTryAt < 2000) return;
    goTry = st.playId; goTryAt = Date.now();
    runTransaction(stateRef, s => {
      if (!s || s.phase !== "playing" || s.playId !== st.playId || !s.wait) return;
      return { ...s, wait: null, waitSince: null, startAt: now() + 3000 };
    }).catch(console.error);
  }
  // 대기가 끝나 진짜 시작 시각이 정해지면 그 시각에 재생 예약
  let armedFor = null;
  function armStart() {
    const st = room?.state || {};
    const song = room?.songs?.[st.index];
    if (st.phase !== "playing" || st.wait || !song || curVideo !== song.videoId) return;
    const k = st.playId + "|" + st.startAt;
    if (armedFor === k) return;
    armedFor = k;
    clearTimeout(startT);
    startT = setTimeout(() => playFrom(song, st.startAt), Math.max(0, st.startAt - now()));
  }

  let lastKey = null;
  function handlePlayback() {
    const st = room.state || {};
    const key = [st.phase, st.index, st.playId].join("|");
    if (key === lastKey) return;
    lastKey = key;
    clearPlayTimers();
    armedFor = null; goodTicks = 0;
    $("#soundAlert").hidden = true;
    watchAds();
    const song = room.songs?.[st.index];
    // 듣는 중에는 플레이어를 1×1px로 숨기고(새 곡을 불러오기 전에 줄임), 정답 공개 때 다시 크게 보여 줌
    $("#ytBox").classList.toggle("tiny", st.phase === "playing");
    try {
      if (st.phase === "playing" && song) schedulePlay(song, st.startAt, key).catch(e => console.error(e));
      else if (st.phase === "reveal" && song) playReveal(song);
      else player.stopVideo();
    } catch (e) { console.error(e); }
  }

  // 버튼을 누른 순간(사용자 동작)에 다시 재생하면 브라우저가 소리를 허용해 줌
  function resync(silent = false) {
    const st = room?.state || {};
    const song = room?.songs?.[st.index];
    $("#soundAlert").hidden = true;
    try {
      if (st.phase === "playing" && song) {
        const el = now() - st.startAt;
        if (el < 0) { player.unMute(); if (!silent) toast("곧 시작해요"); return; }
        if (el >= clipMs()) { if (!silent) toast("이번 곡 재생은 끝났어요"); return; }
        clearPlayTimers();
        if (curVideo !== song.videoId) { player.loadVideoById({ videoId: song.videoId, startSeconds: startOf(song) }); curVideo = song.videoId; }
        playFrom(song, st.startAt);
      } else if (st.phase === "reveal" && song) {
        player.unMute(); player.setVolume(vol()); player.playVideo();
      } else if (!silent) toast("노래가 나올 때 눌러 주세요");
    } catch (e) { console.error(e); }
  }
  $("#resync").onclick = () => resync();
  $("#soundAlert").onclick = () => resync();

  // ----- 방 데이터 구독 -----
  let playlists = {};
  onCleanup(onValue(ref(db, "playlistMeta"), s => { playlists = s.val() || {}; if (room) { renderHeader(); renderControls(true); } }));
  onCleanup(onValue(roomRef, s => {
    room = s.val();
    if (!room) {
      app.innerHTML = hero("방이 사라졌어요", "", { back: true, small: true });
      return;
    }
    renderHeader();
    renderPlayers();
    renderFeed();
    fillAnswers();
    renderStage();
    renderControls();
    handlePlayback();
    armStart();
    tryGo();
    autoAdvance();
  }));
  const tick = setInterval(() => {
    if (!room) return;
    if (["playing", "reveal"].includes(room.state?.phase)) { renderStage(); renderControls(); }
    tryGo();
    autoAdvance();
    autoHost();
  }, 250);
  onCleanup(() => clearInterval(tick));

  const isHost = () => room && room.host === uid;
  const isHintMode = () => (room?.settings?.mode || "speed") === "hint";
  // 다 같이 맞히기: 힌트 전 3점, 첫 번째 힌트 뒤 2점, 두 번째 힌트 뒤 1점
  const pointsAt = el => { const [h1, h2] = hintAt(); return el < h1 ? 3 : el < h2 ? 2 : 1; };
  const myName = () => getName() || "익명";
  const onlineIds = () => Object.entries(room.players || {}).filter(([, p]) => p.online).map(([id]) => id);
  // 스킵 투표할 수 있는 사람: 접속 중이고, 듣는 중일 때는 아직 못 맞힌 사람만
  const solvedMe = st => st?.phase === "playing" && !!st.solved?.[uid];
  const voters = st => onlineIds().filter(id => !(st?.phase === "playing" && st.solved?.[id]));
  const needVotes = st => Math.floor(voters(st).length / 2) + 1;   // 과반수
  const voteCount = st => { const on = new Set(voters(st)); return Object.keys(st?.skips || {}).filter(id => on.has(id)).length; };

  // 새 곡 상태: 모두가 광고·로딩을 끝낼 때까지 기다렸다가(wait) 동시에 3초 카운트다운 시작
  // startAt은 기다리는 동안 임시로 먼 미래 값(최대 대기 + 3초)을 넣어 둠
  const WAIT_MAX = 10000;
  const newPlaying = i => ({ phase: "playing", index: i, startAt: now() + WAIT_MAX + 3000, playId: rid(), wait: true, waitSince: now() });

  // 다음 단계 계산: 듣는 중 → 정답 공개 → 다음 곡(또는 결과)
  function nextState(s) {
    const total = room.songs?.length || 0;
    if (s.phase === "playing") return { ...s, phase: "reveal", revealAt: now(), skips: null };
    if (s.phase === "reveal") {
      const i = s.index + 1;
      return i < total ? newPlaying(i) : { phase: "end" };
    }
    return undefined;
  }

  // 시간이 다 됐거나 스킵 투표가 과반이면 누구의 브라우저든 한 번만 넘김 (트랜잭션)
  let lastTry = "", lastTryAt = 0;
  function autoAdvance() {
    const st = room.state || {};
    let due = false;
    if (st.phase === "playing") due = now() >= st.startAt + clipMs() + 300;
    else if (st.phase === "reveal") due = now() >= (st.revealAt || 0) + REVEAL_MS;
    else return;
    if (!due && (st.phase !== "playing" || voteCount(st) < needVotes(st))) return;
    const key = [st.phase, st.index, st.playId].join("|");
    if (key === lastTry && Date.now() - lastTryAt < 2000) return;
    lastTry = key; lastTryAt = Date.now();
    runTransaction(stateRef, s => {
      if (!s || s.phase !== st.phase || s.index !== st.index || s.playId !== st.playId) return;
      return nextState(s);
    }).catch(console.error);
  }

  // 방장이 10초 넘게 나가 있으면, 가장 먼저 들어온 접속자가 자동으로 방장이 됨
  let hostAwaySince = 0;
  function autoHost() {
    const h = room.players?.[room.host];
    if (h && h.online) { hostAwaySince = 0; return; }
    if (!hostAwaySince) { hostAwaySince = Date.now(); return; }
    if (Date.now() - hostAwaySince < 10000) return;
    const first = Object.entries(room.players || {}).filter(([, p]) => p.online)
      .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0))[0];
    if (first && first[0] === uid) {
      hostAwaySince = Date.now();
      update(roomRef, { host: uid });
      push(ref(db, base + "/feed"), { t: "sys", text: `${myName()}님이 새 방장이 됐어요` });
    }
  }

  let lastHeader = null;
  function renderHeader() {
    const m = playlists[room.settings?.playlistId];
    const sig = m ? m.name + "|" + m.genre + "|" + m.count : "";
    if (sig === lastHeader) return;
    lastHeader = sig;
    $("#roomTitle").textContent = m ? m.name : "노래 맞히기";
    $("#roomSub").textContent = m ? `${m.genre || "기타"} · ${m.count || 0}곡` : "";
    document.title = (m ? m.name + " · " : "") + "노래 맞히기";
  }
  onCleanup(() => { document.title = "노래 맞히기"; });

  function sortedPlayers() {
    return Object.entries(room.players || {}).sort((a, b) =>
      (b[1].score || 0) - (a[1].score || 0) || (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
  }

  // 점수판: 줄을 매번 새로 그리지 않고 바뀐 부분만 고쳐서, 점수 슬롯 애니메이션과 테두리 빛이 끊기지 않게 함
  const rowEls = new Map();      // uid → <li>
  const shownScore = new Map();  // uid → 화면에 보이는 점수
  let reorderT = null;
  function rollScore(el, from, to) {
    const step = to > from ? 1 : -1;
    let nums = [];
    for (let v = from; v !== to + step && nums.length < 12; v += step) nums.push(v);
    if (nums[nums.length - 1] !== to) nums = [...nums.slice(0, 10), to];   // 차이가 크면 중간을 건너뜀
    el.innerHTML = `<span class="roll"><span class="roll-in">${nums.map(n => `<span>${n}</span>`).join("")}</span></span>`;
    const inner = el.querySelector(".roll-in");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      inner.style.transform = `translateY(-${(nums.length - 1) * 1.4}em)`;
    }));
    el.classList.add("bump");
    setTimeout(() => { if (el.contains(inner)) el.textContent = to; el.classList.remove("bump"); }, 1300);
  }
  function renderPlayers() {
    const st = room.state || {};
    const skips = st.skips || {};
    const solved = st.solved || {};
    const list = $("#players");
    const ordered = sortedPlayers();
    const ids = new Set(ordered.map(([id]) => id));
    for (const [id, li] of rowEls) if (!ids.has(id)) { li.remove(); rowEls.delete(id); shownScore.delete(id); }
    ordered.forEach(([id, p], i) => {
      let li = rowEls.get(id);
      if (!li) {
        li = document.createElement("li");
        li.innerHTML = `<span class="rk"></span><span class="nm"></span><span class="sc"></span>`;
        rowEls.set(id, li);
        list.appendChild(li);
        shownScore.set(id, p.score || 0);
        li.querySelector(".sc").textContent = p.score || 0;
      }
      // 이번 문제를 맞힌 사람: 힌트 점수 모드는 solved, 빨리 맞히기는 winner
      const got = (st.phase === "playing" || st.phase === "reveal") && (solved[id] || st.winner === id);
      li.classList.toggle("off", !p.online);
      li.classList.toggle("got-it", !!got);
      li.querySelector(".nm").innerHTML = `${id === room.host ? "👑 " : ""}${esc(p.name)}${id === uid ? " <span class='hint'>(나)</span>" : ""}${solved[id] ? ` <span class='solved'>✅ +${solved[id].p}</span>` : ""}${skips[id] ? " <span class='hint'>⏭</span>" : ""}`;
      const sc = p.score || 0, before = shownScore.get(id);
      if (sc !== before) { shownScore.set(id, sc); rollScore(li.querySelector(".sc"), before, sc); }
    });
    // 순위가 바뀌었으면 숫자가 다 돌아간 뒤에 줄 순서를 바꿈
    const want = ordered.map(([id]) => id).join();
    const have = [...list.children].map(li => [...rowEls].find(([, el]) => el === li)?.[0]).join();
    const placeRanks = () => [...list.children].forEach((li, i) => { li.querySelector(".rk").textContent = i + 1; });
    if (want !== have) {
      clearTimeout(reorderT);
      reorderT = setTimeout(() => {
        sortedPlayers().forEach(([id]) => { const li = rowEls.get(id); if (li) list.appendChild(li); });
        placeRanks();
      }, 1350);
    }
    placeRanks();
  }
  onCleanup(() => clearTimeout(reorderT));

  let lastFeedKey = null;
  let shownFeed = new Set();
  function renderFeed() {
    const items = Object.entries(room.feed || {}).sort((a, b) => (a[0] < b[0] ? -1 : 1)).slice(-60);
    const key = items.length ? items[items.length - 1][0] + items.length : "";
    if (key === lastFeedKey) return;
    lastFeedKey = key;
    const el = $("#feed");
    const line = ([k, f], anim) => {
      const cls = (f.t === "ok" ? "ok" : f.t === "sys" ? "sys" : "") + (anim ? " fade-in" : "");
      const body = f.t === "ok" ? `🎉 ${esc(f.name)}님 정답!${f.a ? ` <span class="ans" data-i="${f.i ?? ""}" data-a="${esc(f.a)}"></span>` : ""}${f.p ? ` <span class="pts">+${f.p}점</span>` : ""}` : f.t === "sys" ? esc(f.text) : `<b>${esc(f.name)}</b> ${esc(f.text)}`;
      return `<div class="${cls}" data-k="${esc(k)}">${body}</div>`;
    };
    if (!items.length) {
      el.innerHTML = `<div class="sys">${(room.settings?.mode || "speed") === "hint" ? "힌트 전에 맞히면 3점, 첫 번째 힌트 뒤 2점, 두 번째 힌트 뒤 1점이에요." : "정답을 입력하면 가장 먼저 맞힌 사람이 1점을 얻어요."}</div>`;
      shownFeed = new Set();
      return;
    }
    // 이미 보이는 줄은 그대로 두고 새 줄만 붙여서 새 줄만 스르륵 나타나게
    const keys = items.map(([k]) => k);
    const continuous = shownFeed.size && keys.some(k => shownFeed.has(k));
    if (!continuous) {
      el.innerHTML = items.map(it => line(it, shownFeed.size === 0 && lastFeedKey !== null)).join("");
    } else {
      el.querySelectorAll("[data-k]").forEach(d => { if (!keys.includes(d.dataset.k)) d.remove(); });
      el.querySelector(":scope > :not([data-k])")?.remove();
      items.filter(([k]) => !shownFeed.has(k)).forEach(it => el.insertAdjacentHTML("beforeend", line(it, true)));
    }
    shownFeed = new Set(keys);
    fillAnswers();
    el.scrollTo({ top: el.scrollHeight, behavior: continuous ? "smooth" : "auto" });
  }
  // 정답자가 친 글자 보여 주기. 다 같이 맞히기에서 그 곡이 아직 진행 중이면 다른 사람에게 스포가 되므로 정답 공개 때까지 가림
  function fillAnswers() {
    const st = room?.state || {};
    const hide = i => isHintMode() && st.phase === "playing" && String(st.index) === i;
    document.querySelectorAll("#feed .ans").forEach(sp => {
      const txt = hide(sp.dataset.i) ? "(정답 공개 때 보여요)" : `(${sp.dataset.a})`;
      if (sp.textContent !== txt) { sp.textContent = txt; sp.classList.toggle("ans-hidden", hide(sp.dataset.i)); }
    });
  }

  let lastCover = null, lastStatus = null;
  function setStage(cover, status, hideCover = false) {
    const c = $("#cover");
    c.classList.toggle("hide", hideCover);
    if (cover !== lastCover) { c.innerHTML = cover; lastCover = cover; }
    if (status !== lastStatus) { $("#status").innerHTML = status; lastStatus = status; }
  }

  const MODE_LABEL = { auto: "정한 곳 (없으면 랜덤)", start: "처음부터", random: "랜덤 구간" };

  function renderStage() {
    const st = room.state || { phase: "lobby" };
    const total = room.songs?.length || 0;
    const song = room.songs?.[st.index];
    const s = room.settings || {};
    const m = playlists[s.playlistId];
    $("#cover").style.background = m ? genreColor(m.genre) : "";

    if (st.phase === "lobby") {
      const n = Object.keys(room.players || {}).length;
      setStage(
        `<div class="big">🎧</div><div class="cv-sub">방장이 게임을 시작하면 노래가 나와요</div>`,
        `<span class="step">대기 중 · ${n}명 참가</span>
         <div class="orig">${(GAME_MODES[s.mode] || GAME_MODES.speed).label} · ${m ? `${esc(m.name)} · ` : ""}${s.count || 10}곡 · 곡당 ${s.clipLen === 0 ? `무제한 (힌트 ${hintSecs()[0]}초 · ${hintSecs()[1]}초)` : (s.clipLen || 30) + "초"} · ${MODE_LABEL[s.startMode || "auto"]}</div>`
      );
    } else if (st.phase === "playing" && song) {
      const t = now(), clip = clipMs(), el = t - st.startAt;
      const step = `<span class="step">${st.index + 1} / ${total}</span>`;
      if (st.wait) {
        const wait = notReady(st);
        const left = Math.max(0, Math.ceil(((st.waitSince || 0) + WAIT_MAX - t) / 1000));
        const names = wait.map(id => esc(room.players?.[id]?.name || "?")).join(", ");
        setStage(`<div class="cv-sub">${st.index + 1}번째</div><div class="big">⏳</div>`,
          `${step}<div>모두 준비되면 같이 시작해요 · ${onlineIds().length - wait.length}/${onlineIds().length}</div>
           ${wait.length ? `<div class="orig">광고 또는 불러오는 중: ${names} · 최대 ${left}초</div>` : ""}`);
        return;
      }
      if (el < 0) {
        setStage(`<div class="cv-sub">${st.index + 1}번째</div><div class="big">${Math.ceil(-el / 1000)}</div>`,
          `${step}<div>곧 시작해요</div>`);
        return;
      }
      const left = Number.isFinite(clip) ? Math.max(0, Math.ceil((clip - el) / 1000)) : fmtTime(el / 1000);
      const hints = [];
      const [t1, t2] = hintAt();
      if (el >= t1 && song.artist) hints.push(`💡 첫 번째 힌트: <b>${esc(artistLabel(song.artist))}</b>`);
      if (el >= t2) hints.push(`💡 두 번째 힌트: <b>${esc(initialHint(song))}</b>`);
      const next = el < t1 ? `${Math.ceil((t1 - el) / 1000)}초 뒤 첫 번째 힌트`
        : el < t2 ? `${Math.ceil((t2 - el) / 1000)}초 뒤 두 번째 힌트`
        : isUnlimited() ? "시간 제한 없음 · 스킵 투표로 넘어가요" : "";
      setStage(`<div class="eq"><span></span><span></span><span></span><span></span><span></span></div><div class="big" style="font-size:40px">${left}</div>`,
        `${step}
         ${Number.isFinite(clip) ? `<div class="timebar"><span id="tbar"></span></div>` : ""}
         <div id="hintBox">${hints.length ? "" : `<div><b>듣는 중!</b> 정답을 입력하세요</div>`}</div>
         <div class="orig" id="nextHint"></div>
         ${isHintMode() ? `<div class="pts-now" id="ptsNow"></div><div class="orig" id="solvedNow"></div>` : ""}`);
      const box = $("#hintBox");
      hints.forEach((h, i) => {
        if (!box.querySelector(`[data-h="${i}"]`)) {
          if (i === 0) box.innerHTML = "";
          box.insertAdjacentHTML("beforeend", `<div class="hint-line fade-in" data-h="${i}">${h}</div>`);
        }
      });
      if ($("#tbar")) $("#tbar").style.width = Math.min(100, (el / clip) * 100) + "%";
      $("#nextHint").textContent = next;
      if (isHintMode()) {
        const mine = st.solved?.[uid];
        $("#ptsNow").innerHTML = mine ? `✅ 맞혔어요! <b>+${mine.p}점</b>` : `지금 맞히면 <b>${pointsAt(el)}점</b>`;
        const names = Object.values(st.solved || {}).map(v => `${esc(v.n)} +${v.p}`);
        $("#solvedNow").textContent = names.length ? "맞힌 사람: " + names.join(" · ") : "";
      }
    } else if (st.phase === "reveal" && song) {
      const sub = [song.orig && norm(song.orig) !== norm(song.answer) ? song.orig : "", artistLabel(song.artist)].filter(Boolean).join(" · ");
      const wait = Math.max(0, Math.ceil(((st.revealAt || 0) + REVEAL_MS - now()) / 1000));
      const last = st.index + 1 >= total;
      setStage("",
        `<div class="reveal-anim">
         <span class="step">${st.index + 1} / ${total} 정답</span>
         <div class="answer">${esc(song.answer)}</div>
         ${sub ? `<div class="orig">${esc(sub)}</div>` : ""}
         ${winLine(st)}
         <div class="orig" style="margin-top:6px" id="revealWait"></div>
         </div>`,
        true);
      $("#revealWait").textContent = `${wait}초 뒤 ${last ? "결과 발표" : "다음 곡"}`;
    } else if (st.phase === "end") {
      const ranks = sortedPlayers();
      const top = ranks[0]?.[1];
      setStage(`<div class="big">🏆</div><div class="cv-sub">${top ? esc(top.name) + "님 우승!" : "게임 끝!"}</div>`,
        `<div class="reveal-anim"><span class="step">최종 결과</span><div style="margin-top:6px">${ranks.map(([, p], i) =>
          `<div>${["🥇", "🥈", "🥉"][i] || i + 1 + "."} ${esc(p.name)} · <b>${p.score || 0}점</b></div>`).join("")}</div></div>`);
    }
  }

  function winLine(st) {
    const solved = Object.values(st.solved || {}).sort((a, b) => b.p - a.p || (a.at || 0) - (b.at || 0));
    if (solved.length) return `<div class="win">🎉 ${solved.map(v => `${esc(v.n)} <b>+${v.p}</b>`).join(" · ")}</div>`;
    if (st.winnerName) return `<div class="win">🎉 ${esc(st.winnerName)}님이 맞혔어요!</div>`;
    return `<div class="orig" style="margin-top:4px">아무도 못 맞혔어요</div>`;
  }

  // ----- 컨트롤: 대기실·결과는 방장, 게임 중에는 모두가 스킵 투표 -----
  let lastCtrlSig = null;
  function renderControls(force = false) {
    const st = room.state || { phase: "lobby" };
    const host = isHost();
    const votes = voteCount(st), need = needVotes(st), mine = !!st.skips?.[uid], done = solvedMe(st);
    const revealLeft = st.phase === "reveal" ? Math.max(0, Math.ceil(((st.revealAt || 0) + REVEAL_MS - now()) / 1000)) : 0;
    const sig = JSON.stringify([st.phase, st.index, room.songs?.length, host, room.settings, votes, need, mine, done, revealLeft]);
    if (!force && sig === lastCtrlSig) return;
    lastCtrlSig = sig;
    const el = $("#controls");

    if (st.phase === "reveal") {   // 정답 공개는 끝까지 감상 (스킵 없음)
      el.innerHTML = `<div class="ctl">
        <button class="btn-secondary" disabled>🎵 감상 중 · ${revealLeft}초 뒤 다음 곡</button>
      </div>`;
      return;
    }
    if (st.phase === "playing") {
      el.innerHTML = `<div class="ctl">
        ${done ? `<button class="btn-secondary" disabled>✅ 맞혔어요 · 이번 곡은 스킵할 수 없어요 · ${votes}/${need}</button>`
          : `<button class="${mine ? "btn" : "btn-secondary"}" data-act="skip">⏭ ${mine ? "스킵 투표 취소" : st.phase === "playing" ? "스킵 투표 (정답 보기)" : "스킵 투표 (다음 곡)"} · ${votes}/${need}</button>`}
        ${host && !done ? `<button class="btn-secondary" data-act="force">⏩ 방장 강제 스킵 <kbd>P</kbd></button>` : ""}
        <span class="hint" style="align-self:center"><kbd>K</kbd> 로도 투표 · 채팅은 <kbd>Enter</kbd>나 클릭으로 열어요</span>
      </div>`;
      return;
    }
    if (!host) {
      el.innerHTML = st.phase === "end" ? `<div class="ctl"><span class="hint">방장이 다시 시작하면 새 게임이 열려요</span></div>` : "";
      return;
    }

    if (st.phase === "lobby") {
      const s = room.settings || {};
      const opts = Object.entries(playlists).filter(([id, m]) => !m.draft || id === s.playlistId)
        .sort((a, b) => String(a[1].genre || "").localeCompare(String(b[1].genre || ""), "ko") || String(a[1].name).localeCompare(String(b[1].name), "ko"))
        .map(([id, m]) => `<option value="${esc(id)}" ${id === s.playlistId ? "selected" : ""}>${m.genre ? `[${esc(m.genre)}] ` : ""}${esc(m.name)} (${m.count || 0}곡)</option>`).join("");
      el.innerHTML = `
      <div class="panel" style="margin-top:0;margin-bottom:16px">
        <h3>⚙️ 게임 설정 <span class="hint">(방장)</span></h3>
        <div class="settings">
          <div style="grid-column:1/-1"><label class="field">문제</label><select id="setPl"><option value="">고르세요</option>${opts}</select></div>
          <div><label class="field">곡 수 ${playlists[s.playlistId] ? `(최대 ${playlists[s.playlistId].count || 0}곡)` : ""}</label><div class="row nowrap"><input id="setCount" class="grow" type="number" min="1" value="${s.count || 10}"><button class="btn-secondary" id="setAll" style="padding:9px 12px">전곡</button></div></div>
          <div><label class="field">곡당 시간 (힌트는 1/3, 2/3 지점)</label><select id="setClip">${[15, 20, 30, 45, 60, 0].map(v => `<option value="${v}" ${v === (s.clipLen ?? 30) ? "selected" : ""}>${v ? v + "초" : "무제한 (스킵으로만)"}</option>`).join("")}</select></div>
          ${s.clipLen === 0 ? `<div style="grid-column:1/-1"><label class="field">무제한일 때 힌트 시간</label>
            <div class="row">
              <span class="hint" style="margin:0">첫 번째 힌트</span><input id="setH1" type="number" min="1" step="1" value="${hintSecs()[0]}" style="width:80px"><span class="hint" style="margin:0">초 뒤,</span>
              <span class="hint" style="margin:0">두 번째 힌트</span><input id="setH2" type="number" min="1" step="1" value="${hintSecs()[1]}" style="width:80px"><span class="hint" style="margin:0">초 뒤</span>
            </div></div>` : ""}
          <div style="grid-column:1/-1"><label class="field">게임 방식</label><select id="setGame">${Object.entries(GAME_MODES).map(([k, v]) => `<option value="${k}" ${k === (s.mode || "speed") ? "selected" : ""}>${v.label} — ${v.desc}</option>`).join("")}</select></div>
          <div style="grid-column:1/-1"><label class="field">재생 구간</label><select id="setMode">${Object.entries(MODE_LABEL).map(([k, v]) => `<option value="${k}" ${k === (s.startMode || "auto") ? "selected" : ""}>${v}</option>`).join("")}</select></div>
        </div>
        <div class="ctl" style="margin:16px 0 0"><button class="btn" data-act="start">게임 시작</button></div>
      </div>`;
      $("#setPl").onchange = e => update(ref(db, base + "/settings"), { playlistId: e.target.value });
      $("#setCount").onchange = e => update(ref(db, base + "/settings"), { count: Math.max(1, parseInt(e.target.value) || 10) });
      $("#setAll").onclick = () => {
        const n = playlists[s.playlistId]?.count;
        if (!n) return toast("문제를 먼저 골라 주세요");
        update(ref(db, base + "/settings"), { count: n });
      };
      $("#setClip").onchange = e => update(ref(db, base + "/settings"), { clipLen: +e.target.value });
      const saveHints = () => {
        const h1 = Math.max(1, parseInt($("#setH1").value) || 15);
        let h2 = Math.max(1, parseInt($("#setH2").value) || 30);
        if (h2 < h1) { h2 = h1; toast("두 번째 힌트는 첫 번째 힌트보다 늦게 나와요"); }
        update(ref(db, base + "/settings"), { hint1: h1, hint2: h2 });
      };
      if ($("#setH1")) { $("#setH1").onchange = saveHints; $("#setH2").onchange = saveHints; }
      $("#setMode").onchange = e => update(ref(db, base + "/settings"), { startMode: e.target.value });
      $("#setGame").onchange = e => update(ref(db, base + "/settings"), { mode: e.target.value });
    } else if (st.phase === "end") {
      el.innerHTML = `<div class="ctl"><button class="btn" data-act="again">다시 하기</button><a class="btn-secondary" href="#/">다른 문제 고르기</a></div>`;
    }
  }

  // 방장 강제 스킵: 투표 없이 바로 다음 단계로 (듣는 중 → 정답 공개, 정답 공개 → 다음 곡)
  async function forceSkip() {
    const st = room?.state || {};
    if (!isHost() || (st.phase !== "playing" && st.phase !== "reveal")) return;
    if (solvedMe(st)) return toast("이미 맞혔어요! 이번 곡은 스킵할 수 없어요");
    if (st.phase === "reveal") return toast("정답 공개 중에는 스킵할 수 없어요");
    await runTransaction(stateRef, s => {
      if (!s || s.phase !== st.phase || s.index !== st.index) return;
      return nextState(s);
    }).catch(console.error);
  }

  async function skipVote() {
    const st = room.state || {};
    if (solvedMe(st)) return toast("이미 맞혔어요! 이번 곡은 스킵할 수 없어요");
    if (st.phase === "reveal") return toast("정답 공개 중에는 스킵할 수 없어요");
    const on = new Set(voters(st));
    const need = needVotes(st);
    await runTransaction(stateRef, s => {
      if (!s || s.phase !== "playing" || s.index !== st.index) return;
      if (s.solved?.[uid]) return;
      s.skips = s.skips || {};
      if (s.skips[uid]) delete s.skips[uid]; else s.skips[uid] = true;
      const votes = Object.keys(s.skips).filter(id => on.has(id)).length;
      if (votes >= need) return nextState(s);
      return s;
    });
  }

  $("#controls").addEventListener("click", async e => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    try {
      if (act === "skip") await skipVote();
      else if (act === "force") await forceSkip();
      else if (act === "start" && isHost()) await startGame();
      else if (act === "again" && isHost()) await set(stateRef, { phase: "lobby" });
    } catch (err) {
      console.error(err);
      toast("처리하지 못했어요. 잠시 후 다시 눌러 주세요");
    }
  });

  async function startGame() {
    const s = room.settings || {};
    if (!s.playlistId) return toast("문제를 골라 주세요");
    const all = Object.entries((await get(ref(db, "playlistSongs/" + s.playlistId))).val() || {}).map(([sid, x]) => ({ ...x, sid }));
    if (!all.length) return toast("이 문제에는 곡이 없어요");
    // rf: 랜덤 구간 위치 (곡 길이의 20~65% 지점). 모든 참가자가 같은 값을 써서 같은 구간을 들어요.
    const songs = shuffle(all).slice(0, Math.min(s.count || 10, all.length)).map(x => ({
      sid: x.sid, videoId: x.videoId, start: x.start || 0, end: x.end || 0, gap: x.gap || 0, len: x.len || 0, rf: +(0.2 + Math.random() * 0.45).toFixed(3),
      answer: x.answer, alts: x.alts || "", orig: x.orig || "", artist: x.artist || ""
    }));
    const updates = { songs, feed: null, ready: null, state: newPlaying(0) };
    for (const id of Object.keys(room.players || {})) updates[`players/${id}/score`] = 0;
    await update(roomRef, updates);
    await push(ref(db, base + "/feed"), { t: "sys", text: `게임 시작! 총 ${songs.length}곡이에요` });
  }

  // ----- 정답/채팅 입력 -----
  async function send() {
    const input = $("#gIn");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    const st = room.state || {};
    const song = room.songs?.[st.index];
    if (st.phase === "playing" && song && now() < st.startAt && isCorrect(text, song)) return toast("아직 노래가 시작하지 않았어요");
    const correct = st.phase === "playing" && song && now() >= st.startAt && isCorrect(text, song);

    if (correct && isHintMode()) {
      if (st.solved?.[uid]) return toast("이미 맞혔어요! 정답은 채팅에 올라가지 않아요");
      const pts = pointsAt(now() - st.startAt);
      const on = new Set(onlineIds());
      const res = await runTransaction(stateRef, s => {
        if (!s || s.phase !== "playing" || s.index !== st.index || s.solved?.[uid]) return;
        s.solved = s.solved || {};
        s.solved[uid] = { n: myName(), p: pts, at: now() };
        // 접속한 사람이 모두 맞히면 바로 정답 공개
        if ([...on].every(id => s.solved[id])) return nextState(s);
        return s;
      });
      if (res.committed) {
        await runTransaction(ref(db, `${base}/players/${uid}/score`), v => (v || 0) + pts);
        await push(ref(db, base + "/feed"), { t: "ok", name: myName(), p: pts, a: text.slice(0, 60), i: st.index });
      } else toast("시간이 끝났어요!");
      return;
    }

    if (correct) {
      const res = await runTransaction(stateRef, s => {
        if (!s || s.phase !== "playing" || s.winner || s.index !== st.index) return;
        s.winner = uid;
        s.winnerName = myName();
        s.phase = "reveal";
        s.revealAt = now();
        s.skips = null;
        return s;
      });
      if (res.committed) {
        await runTransaction(ref(db, `${base}/players/${uid}/score`), v => (v || 0) + 1);
        await push(ref(db, base + "/feed"), { t: "ok", name: myName(), a: text.slice(0, 60), i: st.index });
      } else {
        toast("아쉽게 한 발 늦었어요!");
      }
    } else {
      await push(ref(db, base + "/feed"), { t: "chat", name: myName(), text: text.slice(0, 60) });
    }
  }
  // ----- 채팅 열기/닫기 -----
  // 채팅은 Enter로만 시작: Enter → 채팅 열림 → 입력 → Enter로 보내고 닫힘 (빈 칸에서 Enter나 Esc도 닫힘)
  // 채팅이 닫혀 있을 때 K = 스킵 투표. 휴대폰은 Enter 키가 없으니 채팅칸을 누르면 열림.
  const gIn = $("#gIn");
  const PH_CLOSED = "Enter나 클릭으로 채팅 · K로 스킵 투표";
  const PH_OPEN = "정답이나 채팅을 입력하고 Enter";
  let chatOpen = false;
  const openChat = () => {
    chatOpen = true;
    gIn.readOnly = false;
    gIn.placeholder = PH_OPEN;
    gIn.classList.add("chat-open");
    gIn.focus();
  };
  const closeChat = () => {
    chatOpen = false;
    gIn.value = "";
    gIn.readOnly = true;
    gIn.placeholder = PH_CLOSED;
    gIn.classList.remove("chat-open");
    gIn.blur();
  };
  closeChat();

  const onKey = e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.isComposing || e.keyCode === 229) return;
    if (chatOpen) return;   // 채팅 중에는 입력칸이 알아서 처리
    const other = e.target.closest("input, textarea, select, [contenteditable]");
    if (other && other !== gIn) return;   // 볼륨 등 다른 입력칸
    if (e.key === "Enter") { e.preventDefault(); openChat(); return; }
    if (e.code === "KeyK") {
      e.preventDefault();
      const ph = room?.state?.phase;
      if (ph === "playing" || ph === "reveal") skipVote().catch(console.error);
    }
    if (e.code === "KeyP" && isHost()) {   // 방장 강제 스킵
      e.preventDefault();
      forceSkip();
    }
  };
  document.addEventListener("keydown", onKey);
  onCleanup(() => document.removeEventListener("keydown", onKey));

  gIn.addEventListener("keydown", e => {
    if (!chatOpen) return;
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      e.stopPropagation();   // 닫자마자 다시 열리지 않게
      if (gIn.value.trim()) send();   // send()가 값을 읽은 뒤 비움
      closeChat();
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeChat(); }
  });
  // 채팅칸을 마우스나 손가락으로 눌러도 열림
  gIn.addEventListener("pointerdown", () => { if (!chatOpen) openChat(); });
  gIn.addEventListener("blur", () => { if (chatOpen && !gIn.value) closeChat(); });
  $("#gSend").onclick = () => {
    if (!chatOpen) return openChat();
    if (gIn.value.trim()) send();
    closeChat();
  };
}


route();
</script>
</body>
</html>
