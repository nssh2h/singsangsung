<html lang="ko">
<head>
<meta charset="utf-8">

<title>노래 맞히기</title>

<style>
:root{
  --primary:#3b9ff0; --primary-hover:#1f86dc; --bg:#eef7ff; --card:#fff; --text:#2b2b2b; --muted:#666;
  --line:#d3eafc; --badge-bg:#dcefff; --badge-text:#1769ad; --ok:#1f8a5b; --danger:#d6336c;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:50px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
a.link{color:var(--primary-hover);text-decoration:underline}

/* 헤더 */
.hero{background:linear-gradient(135deg,#3b9ff0 0%,#7cc4fa 100%);color:#fff;padding:30px 20px 50px;text-align:center;box-shadow:0 4px 15px rgba(59,159,240,.2)}
.hero h1{font-size:2.2rem;margin-bottom:6px;line-height:1.3}
.hero p{font-size:.95rem;opacity:.9}
.hero .back{display:inline-block;color:#fff;opacity:.85;font-size:.85rem;margin-bottom:8px}
.hero .back:hover{opacity:1;text-decoration:underline}
.hero.small{padding:22px 20px 44px}
.hero.small h1{font-size:1.7rem}
.room-code{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 8px 5px 16px;margin-top:10px;font-size:.9rem}
.room-code b{font:800 1.15rem ui-monospace,Consolas,monospace;letter-spacing:3px}
.room-code button{border:none;border-radius:999px;background:#fff;color:var(--badge-text);font:inherit;font-size:.8rem;font-weight:bold;padding:4px 12px;cursor:pointer}

.container{max-width:1100px;margin:0 auto;padding:20px}
.container.narrow{max-width:760px}
.panel{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.05);margin-top:20px}
.panel.lift{margin-top:-44px}
.panel h3{font-size:1rem;color:var(--primary);margin-bottom:12px}
.filter-section{display:flex;flex-direction:column;gap:15px}
.filter-group{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filter-label{font-weight:bold;min-width:70px;font-size:.9rem;color:var(--muted)}
.filter-btn{padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;font:inherit;font-size:.85rem;color:inherit;transition:all .2s ease;white-space:nowrap}
.filter-btn.active,.filter-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-btn.danger{color:var(--danger)}
.filter-btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.filter-btn:disabled{opacity:.5;cursor:default}
.count-row{margin-bottom:14px}
.count-pill{display:inline-block;padding:9px 18px;border-radius:999px;background:var(--primary);color:#fff;font-size:.9rem}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea,.search-input{
  font:inherit;font-size:.95rem;color:var(--text);padding:10px 14px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input[type=range]{accent-color:var(--primary);width:100%}
textarea{width:100%;resize:vertical}
.grow{flex:1}
.full{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nowrap{flex-wrap:nowrap}
.field{display:block;font-size:.82rem;font-weight:bold;color:var(--muted);margin:14px 0 5px}
.field:first-child{margin-top:0}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}
code{font:.8rem ui-monospace,Consolas,monospace;background:var(--badge-bg);color:var(--badge-text);padding:1px 6px;border-radius:5px}
details summary{cursor:pointer;font-weight:bold;color:var(--primary)}
.watch-btn,.btn{background:var(--primary);color:#fff;border:none;padding:9px 18px;border-radius:8px;font:inherit;font-size:.9rem;font-weight:bold;cursor:pointer;transition:background .2s ease;white-space:nowrap;display:inline-block}
.watch-btn:hover,.btn:hover{background:var(--primary-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit;font-size:.85rem;white-space:nowrap;display:inline-block}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary-hover)}
.empty{text-align:center;color:var(--muted);padding:60px 0;grid-column:1/-1}

/* 문제 카드 */
.grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:25px}
.card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.03);
  display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s ease,box-shadow .2s ease;min-width:0;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 15px rgba(0,0,0,.08)}
.thumb{display:block;position:relative;aspect-ratio:16/9;margin:-20px -20px 14px;border-radius:12px 12px 0 0;overflow:hidden;background:linear-gradient(135deg,#c3e6fd,#8fcdf8);cursor:pointer}
.thumb .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:1.5rem;letter-spacing:.5px;text-shadow:0 2px 6px rgba(0,0,0,.2);padding:0 16px;text-align:center}
.thumb .ph small{font-size:.85rem;opacity:.9;font-weight:600;margin-top:2px}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);color:#fff;font-weight:bold;opacity:0;transition:opacity .2s}
.thumb:hover .play{opacity:1}
.multi-badge{position:absolute;right:8px;bottom:8px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:.78rem;padding:3px 9px;border-radius:999px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.category-badge{background:var(--badge-bg);color:var(--badge-text);font-size:.75rem;padding:3px 10px;border-radius:12px;font-weight:bold;white-space:nowrap}
.card-date{font-size:.8rem;color:var(--muted)}
.card-title{font-size:1.1rem;font-weight:bold;margin-bottom:6px;overflow-wrap:anywhere}
.card-info{font-size:.85rem;color:var(--muted);margin-bottom:15px;overflow-wrap:anywhere}
.card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f0f0f0;padding-top:12px;gap:8px}
.mini-cover{flex:none;width:150px;aspect-ratio:16/9;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;text-shadow:0 2px 6px rgba(0,0,0,.2);box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* 방 화면 */
.room-grid{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start;margin-top:-44px}
@media (max-width:820px){ .room-grid{grid-template-columns:1fr} }
.room-grid .panel{margin-top:0;margin-bottom:16px}
.video-box{position:relative;aspect-ratio:16/9;background:#14101f;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:16px}
.video-box iframe,.video-box > div:first-child{position:absolute;inset:0;width:100%;height:100%}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#3b9ff0,#7cc4fa);color:#fff;text-align:center;padding:16px}
.cover.hide{display:none}
.cover .cv-sub{opacity:.9;font-size:.95rem;font-weight:600}
.big{font-size:64px;font-weight:800;line-height:1}
.eq{display:flex;gap:7px;height:60px;align-items:flex-end}
.eq span{width:10px;background:#fff;border-radius:4px;animation:eq .9s infinite ease-in-out}
.eq span:nth-child(2){animation-delay:.15s}.eq span:nth-child(3){animation-delay:.3s}
.eq span:nth-child(4){animation-delay:.45s}.eq span:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:12px}50%{height:60px}}
.status{text-align:center}
.status .step{display:inline-block;background:var(--badge-bg);color:var(--badge-text);font-size:.78rem;font-weight:bold;padding:2px 10px;border-radius:12px;margin-bottom:4px}
.answer{font-size:1.7rem;font-weight:800;margin:2px 0;color:var(--primary-hover);line-height:1.3}
.orig{color:var(--muted);font-size:.9rem}
.win{color:var(--ok);font-weight:bold;margin-top:4px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings .field{margin:0 0 5px}
.settings select,.settings input{width:100%}
@media (max-width:560px){ .settings{grid-template-columns:1fr} }
.players{list-style:none}
.players li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0f0f0;font-size:.92rem}
.players li:first-child{border-top:0}
.players .rk{width:22px;height:22px;border-radius:50%;background:var(--badge-bg);color:var(--badge-text);font-weight:bold;font-size:.75rem;display:grid;place-items:center;flex:none}
.players .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players .sc{font-weight:800;color:var(--primary)}
.players li.off{opacity:.4}
.feed{max-height:240px;overflow-y:auto;font-size:.9rem;margin-top:12px}
.feed div{padding:2px 0;word-break:break-all}
.feed .ok{color:var(--ok);font-weight:bold}
.feed .sys{color:var(--muted)}

/* 편집 화면 */
.song{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #f0f0f0}
.song:first-child{border-top:0}
.song .num{width:26px;color:var(--muted);text-align:center;flex:none;font-size:.8rem}
.song img{width:104px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:var(--badge-bg)}
.song .txt{flex:1;min-width:0;font-size:.9rem}
.song .sub{display:block;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:560px){ .song img{width:72px} .song{flex-wrap:wrap} }

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22303d;color:#fff;padding:10px 18px;border-radius:999px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center;font-size:.9rem}
#toast.show{opacity:1}
@media (max-width:560px){ .hero h1{font-size:1.7rem} .filter-label{min-width:0;width:100%} }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, get, set, update, push, onValue, runTransaction, onDisconnect, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ============================================================
//  Firebase 설정
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBVIT1zQdeDfkXZ2TjZfNGOGsQ1ZiEcaqU",
  authDomain: "sing-54233.firebaseapp.com",
  databaseURL: "https://sing-54233-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sing-54233",
  storageBucket: "sing-54233.firebasestorage.app",
  messagingSenderId: "71824296336",
  appId: "1:71824296336:web:ac86b50278c041198a8b15"
};
// ============================================================

// 장르 칩·장르 입력칸에 기본으로 보여 줄 장르 (자유롭게 고쳐도 돼요)
const DEFAULT_GENRES = ["종합", "여돌", "남돌", "JPOP", "발라드", "OST", "밴드", "팝송"];

// ---------- UTILS START ----------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 정답 비교용: 소문자로, 띄어쓰기·기호 제거
function norm(s) {
  return String(s ?? "").normalize("NFKC").toLowerCase()
    .replace(/[^0-9a-zㄱ-ㆎ가-힣぀-ヿ一-鿿]/g, "");
}

function isCorrect(text, song) {
  const g = norm(text);
  if (!g) return false;
  const answers = [song.answer, ...String(song.alts || "").split(",")].map(norm).filter(Boolean);
  return answers.includes(g);
}

// "75", "1:15", "1m15s" → 초
function parseTime(t) {
  t = String(t ?? "").trim();
  if (!t) return 0;
  if (/^\d+(\.\d+)?s?$/.test(t)) return parseFloat(t);
  const hms = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  if (hms && (hms[1] || hms[2] || hms[3])) return (+hms[1] || 0) * 3600 + (+hms[2] || 0) * 60 + (+hms[3] || 0);
  const parts = t.split(":").map(Number);
  if (parts.some(n => isNaN(n))) return NaN;
  return parts.reduce((a, b) => a * 60 + b, 0);
}

function fmtTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function parseYouTube(input) {
  input = String(input ?? "").trim();
  if (!input) return null;
  if (/^[\w-]{11}$/.test(input)) return { id: input, t: null };
  let u;
  try { u = new URL(/^https?:\/\//.test(input) ? input : "https://" + input); } catch { return null; }
  let id = null;
  if (u.hostname.endsWith("youtu.be")) id = u.pathname.slice(1, 12);
  else if (u.searchParams.get("v")) id = u.searchParams.get("v");
  else {
    const m = u.pathname.match(/\/(shorts|embed|live|v)\/([\w-]{11})/);
    if (m) id = m[2];
  }
  if (!id || !/^[\w-]{11}$/.test(id)) return null;
  const t = u.searchParams.get("t") || u.searchParams.get("start");
  return { id, t: t ? parseTime(t) : null };
}

// 영상 제목에서 곡 제목 추측: 'The Chase' 처럼 따옴표 안을 우선 사용
function guessAnswer(title) {
  if (!title) return "";
  const q = title.match(/['‘’"“”「『]([^'‘’"“”「」『』]{1,60})['‘’"“”」』]/);
  if (q) return q[1].trim();
  let s = title.replace(/[\[(【][^\])】]*[\])】]/g, " ");
  if (s.includes(" - ")) s = s.split(" - ").slice(1).join(" - ");
  s = s.replace(/\b(official|music video|m\/v|mv|audio|lyrics?|lyric video|performance video|special video|visualizer)\b/gi, " ");
  return s.replace(/\s+/g, " ").trim();
}

function cleanAlts(s) {
  const seen = new Set();
  return String(s ?? "").split(",").map(x => x.trim()).filter(x => x && !seen.has(norm(x)) && seen.add(norm(x))).join(", ");
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 재생 시작 지점 정하기
// mode: "auto"(곡에 정한 곳, 없으면 랜덤) | "start"(처음부터) | "random"(랜덤 구간)
function pickStart(song, mode, durationSec) {
  const len = song.len || durationSec || 0;
  const random = () => (len > 40 ? Math.floor(len * (song.rf ?? 0.3)) : 0);
  if (mode === "start") return 0;
  if (mode === "random") return random();
  return song.start > 0 ? song.start : random();
}

// 장르 이름으로 표지 색 정하기 (같은 장르는 늘 같은 색)
const GENRE_HUES = { "종합": 205, "여돌": 335, "남돌": 225, "JPOP": 5, "발라드": 175, "OST": 130, "밴드": 30, "팝송": 265 };
function genreColor(g) {
  let hue = GENRE_HUES[g];
  if (hue == null) {
    let h = 0;
    for (const ch of String(g || "기타")) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    hue = h % 360;
  }
  return `linear-gradient(135deg, hsl(${hue} 80% 62%), hsl(${(hue + 25) % 360} 75% 74%))`;
}
// ---------- UTILS END ----------

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const rid = () => Math.random().toString(36).slice(2, 10);

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

const uid = localStorage.getItem("uid") || (() => {
  const v = (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "") : Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 16);
  localStorage.setItem("uid", v);
  return v;
})();
const getName = () => (localStorage.getItem("nickname") || "").trim();
const setName = n => localStorage.setItem("nickname", String(n).trim().slice(0, 12));

async function hashPw(pid, pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pid + ":" + pw));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function fetchTitle(videoId) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch("https://noembed.com/embed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + videoId), { signal: ctrl.signal });
    clearTimeout(timer);
    const j = await r.json();
    return { title: j.title || "", artist: (j.author_name || "").replace(/ - Topic$/, "") };
  } catch { return { title: "", artist: "" }; }
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}

function miniCover(m) {
  return `<span class="mini-cover" style="background:${genreColor(m.genre)}">${esc(m.genre || "🎵")}</span>`;
}

// ---------- YouTube 플레이어 ----------
async function createPlayer(elId, { controls = 0, onError } = {}) {
  await window.__ytReady;
  return new Promise(resolve => {
    const p = new YT.Player(elId, {
      width: "100%", height: "100%",
      playerVars: { controls, disablekb: controls ? 0 : 1, playsinline: 1, rel: 0, fs: 0, iv_load_policy: 3, modestbranding: 1 },
      events: { onReady: () => resolve(p), onError: e => onError && onError(e) }
    });
  });
}
const EMBED_BLOCKED = "이 영상은 다른 사이트에서 재생할 수 없게 막혀 있어요";

// ---------- Firebase ----------
let db = null;
let serverOffset = 0;
const now = () => Date.now() + serverOffset;
const configured = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL);
if (configured) {
  db = getDatabase(initializeApp(firebaseConfig));
  onValue(ref(db, ".info/serverTimeOffset"), s => { serverOffset = s.val() || 0; });
}

async function createRoom(playlistId, count) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = null;
  for (let i = 0; i < 10 && !code; i++) {
    const c = Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    if (!(await get(ref(db, "rooms/" + c))).exists()) code = c;
  }
  if (!code) throw new Error("방 코드를 만들지 못했어요");
  await set(ref(db, "rooms/" + code), {
    createdAt: serverTimestamp(),
    host: uid,
    settings: { playlistId: playlistId || "", count: Math.max(1, Math.min(10, count || 10)), clipLen: 15, startMode: "auto" },
    state: { phase: "lobby" }
  });
  location.hash = "#/room/" + code;
}

// ---------- 라우터 ----------
let cleanups = [];
let viewId = 0;
const onCleanup = fn => cleanups.push(fn);

function route() {
  cleanups.forEach(fn => { try { fn(); } catch {} });
  cleanups = [];
  viewId++;
  window.scrollTo(0, 0);
  if (!configured) return viewSetup();
  const parts = (location.hash.slice(1) || "/").split("/").filter(Boolean);
  if (parts[0] === "room" && parts[1]) return viewRoom(parts[1].toUpperCase());
  if (parts[0] === "new") return viewNew();
  if (parts[0] === "list" && parts[1]) return viewList(parts[1]);
  viewHome();
}
window.addEventListener("hashchange", route);

function hero(title, sub, { back = false, small = false, extra = "" } = {}) {
  return `<header class="hero${small ? " small" : ""}">
    ${back ? `<a href="#/" class="back">← 문제 목록</a><br>` : ""}
    <h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}${extra}
  </header>`;
}

function viewSetup() {
  app.innerHTML = hero("🎵 노래 맞히기", "") + `

    <h3>Firebase 설정이 필요해요</h3>
    index.html 위쪽의 <code>firebaseConfig</code>에 Firebase 콘솔에서 복사한 값을 붙여 넣어 주세요.

}

// ============================================================
//  첫 화면: 문제 목록
// ============================================================
function viewHome() {
  const st = { q: "", genre: "", sort: "new" };
  try { Object.assign(st, JSON.parse(localStorage.getItem("sq-filter") || "{}"), { q: "" }); } catch {}
  const save = () => { try { localStorage.setItem("sq-filter", JSON.stringify({ genre: st.genre, sort: st.sort })); } catch {} };

  app.innerHTML = hero("🎵 노래 맞히기", "문제를 누르면 그 장르로 방이 만들어져요 · 친구들과 실시간으로 맞혀요 🩵") + `
  <div class="container">
    <div class="panel lift">
      <div class="filter-group">
        <span class="filter-label">닉네임</span>
        <input type="text" id="nick" maxlength="12" placeholder="닉네임" value="${esc(getName())}" style="width:150px">
        <span class="filter-label" style="min-width:0;margin-left:10px">방 코드</span>
        <input type="text" id="code" maxlength="6" placeholder="K7PX" style="width:100px;text-transform:uppercase">
        <button class="watch-btn" id="join">입장</button>
      </div>
    </div>

    <div class="panel filter-section">
      <div class="filter-group" id="gRow"><span class="filter-label">장르</span></div>
      <div class="filter-group">
        <span class="filter-label">정렬</span>
        <button class="filter-btn" data-sort="new">최근 수정순</button>
        <button class="filter-btn" data-sort="name">이름순</button>
        <button class="filter-btn" data-sort="count">곡 많은 순</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">검색</span>
        <input type="search" id="q" class="search-input" style="flex:1;min-width:200px" placeholder="문제 이름, 장르, 만든 사람으로 검색">
      </div>
    </div>

    <div class="row" style="margin-top:25px;justify-content:space-between">
      <span class="count-pill">문제 <span id="count">0</span></span>
      <a class="watch-btn" href="#/new">＋ 새 문제 만들기</a>
    </div>
    <div class="grid-container" id="list" style="margin-top:16px"><div class="empty">불러오는 중…</div></div>
  </div>`;

  const requireName = () => {
    if (getName()) return true;
    toast("닉네임을 먼저 입력해 주세요");
    $("#nick").focus();
    return false;
  };
  $("#nick").addEventListener("input", e => setName(e.target.value));
  const join = () => {
    const c = $("#code").value.trim().toUpperCase();
    if (!c) return toast("방 코드를 입력해 주세요");
    if (requireName()) location.hash = "#/room/" + c;
  };
  $("#join").onclick = join;
  $("#code").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) join(); });
  $("#q").oninput = e => { st.q = e.target.value.trim().toLowerCase(); render(); };
  document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { st.sort = b.dataset.sort; render(); });

  let lists = {};
  onCleanup(onValue(ref(db, "playlistMeta"), s => { lists = s.val() || {}; render(); }));

  function render() {
    if (!$("#list")) return;
    save();
    document.querySelectorAll("[data-sort]").forEach(b => b.classList.toggle("active", b.dataset.sort === st.sort));

    // 장르 칩: 기본 장르 + 실제로 쓰인 장르
    const used = [...new Set(Object.values(lists).map(m => m.genre || "기타"))];
    const genres = [...DEFAULT_GENRES, ...used.filter(g => !DEFAULT_GENRES.includes(g) && g !== "기타").sort(), ...(used.includes("기타") ? ["기타"] : [])];
    if (st.genre && !genres.includes(st.genre)) st.genre = "";
    const gRow = $("#gRow");
    gRow.querySelectorAll(".filter-btn").forEach(b => b.remove());
    [["", "전체"], ...genres.map(g => [g, g])].forEach(([k, label]) => {
      const b = document.createElement("button");
      b.className = "filter-btn" + (k === st.genre ? " active" : "");
      b.textContent = label;
      b.onclick = () => { st.genre = k; render(); };
      gRow.appendChild(b);
    });

    const order = g => { const i = genres.indexOf(g || "기타"); return i < 0 ? 999 : i; };
    let arr = Object.entries(lists).filter(([, m]) =>
      (!st.genre || (m.genre || "기타") === st.genre) &&
      (!st.q || st.q.split(/\s+/).every(w => `${m.name} ${m.genre || ""} ${m.createdBy || ""}`.toLowerCase().includes(w))));
    arr.sort(st.sort === "name" ? (a, b) => String(a[1].name).localeCompare(String(b[1].name), "ko")
      : st.sort === "count" ? (a, b) => (b[1].count || 0) - (a[1].count || 0)
      : (a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));
    $("#count").textContent = `${arr.length}개 · ${arr.reduce((n, [, m]) => n + (m.count || 0), 0).toLocaleString()}곡`;

    if (!arr.length) {
      $("#list").innerHTML = Object.keys(lists).length
        ? `<div class="empty">조건에 맞는 문제가 없어요</div>`
        : `<div class="empty">아직 문제가 없어요.<br><a class="link" href="#/new">＋ 새 문제 만들기</a>로 첫 문제를 만들어 보세요.</div>`;
      return;
    }

    $("#list").innerHTML = arr.map(([id, m]) => `
      <div class="card">
        <div>
          <a class="thumb" data-play="${esc(id)}" style="background:${genreColor(m.genre)}" role="button" tabindex="0" title="이 문제로 방 만들기">
            <span class="ph">${esc(m.name)}<small>${esc(m.genre || "기타")}</small></span>
            <span class="play">▶ 방 만들기</span>
            <span class="multi-badge">${m.count || 0}곡</span>
          </a>
          <div class="card-header">
            <span class="category-badge">${esc(m.genre || "기타")}</span>
            <span class="card-date">${fmtDate(m.updatedAt)}</span>
          </div>
          <div class="card-title">${esc(m.name)}</div>
          <div class="card-info">${m.count || 0}곡 · 만든 사람 ${esc(m.createdBy || "익명")}</div>
        </div>
        <div class="card-footer">
          <a class="btn-secondary" href="#/list/${esc(id)}">✏️ 편집</a>
          <button class="watch-btn" data-play="${esc(id)}">▶ 방 만들기</button>
        </div>
      </div>`).join("");
  }

  const play = async id => {
    if (!requireName()) return;
    const m = lists[id];
    if (!m) return;
    if (!m.count) return toast("아직 곡이 없는 문제예요. 편집에서 곡을 먼저 넣어 주세요");
    try { await createRoom(id, m.count); }
    catch (e) { console.error(e); toast("방을 만들지 못했어요. Firebase 설정과 규칙을 확인해 주세요"); }
  };
  $("#list").addEventListener("click", e => {
    const el = e.target.closest("[data-play]");
    if (el) play(el.dataset.play);
  });
  $("#list").addEventListener("keydown", e => {
    const el = e.target.closest("[data-play]");
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); play(el.dataset.play); }
  });
}

function genreDatalist(id) {
  return `<datalist id="${id}">${DEFAULT_GENRES.map(g => `<option value="${esc(g)}">`).join("")}</datalist>`;
}

function viewNew() {
  app.innerHTML = hero("새 문제 만들기", "만든 다음 곡을 넣으면 첫 화면 목록에 나타나요", { back: true, small: true }) + `
  <div class="container narrow">
    <div class="panel lift">
      <label class="field">문제 이름</label>
      <input type="text" id="plName" class="full" maxlength="40" placeholder="예: JPOP 맞히기">
      <label class="field">장르 (고르거나 직접 입력)</label>
      <input type="text" id="plGenre" class="full" maxlength="12" list="genres" placeholder="예: 종합, 여돌, JPOP">
      ${genreDatalist("genres")}
      <label class="field">편집 비밀번호</label>
      <input type="password" id="plPw" class="full" placeholder="곡을 추가하거나 고칠 때 필요해요">
      <div style="margin-top:18px"><button class="btn" id="plCreate">만들기</button></div>
    </div>
  </div>`;

  $("#plCreate").onclick = async () => {
    const name = $("#plName").value.trim();
    const genre = $("#plGenre").value.trim();
    const pw = $("#plPw").value;
    if (!name) return toast("문제 이름을 입력해 주세요");
    if (!pw) return toast("편집 비밀번호를 정해 주세요");
    $("#plCreate").disabled = true;
    const r = push(ref(db, "playlistMeta"));
    await set(r, { name, genre, count: 0, createdBy: getName() || "익명", pwHash: await hashPw(r.key, pw), updatedAt: serverTimestamp() });
    sessionStorage.setItem("unlock_" + r.key, "1");
    location.hash = "#/list/" + r.key;
  };
}

// ============================================================
//  문제(플레이리스트) 편집

async function viewList(pid) {
  const my = viewId;
  const unlocked = sessionStorage.getItem("unlock_" + pid) === "1";
  const metaRef = ref(db, "playlistMeta/" + pid);
  const songsRef = ref(db, "playlistSongs/" + pid);

  app.innerHTML = hero(`<span id="title">불러오는 중…</span>`, `<span id="info"></span>`, {
    back: true, small: true,
    extra: `<div style="margin-top:12px"><button class="btn-secondary" id="playBtn" style="font-weight:bold">▶ 이 문제로 방 만들기</button></div>`
  }) + `
  <div class="container narrow">
    ${unlocked ? `
    <div class="panel lift" id="formCard">
      <h3 id="formTitle">곡 추가</h3>
      <label class="field">YouTube 링크</label>
      <div class="row nowrap"><input type="text" id="url" class="grow" placeholder="https://youtu.be/..."><button class="btn-secondary" id="load">불러오기</button></div>
      <div class="video-box" style="margin:12px 0 0"><div id="pv"></div><div class="cover" id="pvCover"><div class="cv-sub">링크를 넣고 불러오기를 누르세요</div></div></div>
      <label class="field">정답 (공개될 때 크게 보이는 이름)</label>
      <input type="text" id="answer" class="full" placeholder="예: 무희">
      <label class="field">다른 정답 (쉼표로 구분)</label>
      <input type="text" id="alts" class="full" placeholder="예: 오도리코, 踊り子">
      <div class="row" style="gap:12px">
        <div class="grow"><label class="field">원래 제목 (선택)</label><input type="text" id="orig" class="full" placeholder="예: 踊り子"></div>
        <div class="grow"><label class="field">가수 (선택)</label><input type="text" id="artist" class="full" placeholder="예: Vaundy"></div>
      </div>
      <label class="field">시작 지점 (비워 두면 랜덤 구간)</label>
      <div class="row">
        <input type="text" id="start" placeholder="0:00" style="width:90px">
        <button class="btn-secondary" id="setNow">지금 위치로</button>
        <button class="btn-secondary" id="previewBtn">▶ 시작 지점부터 10초</button>
      </div>
      <div class="row" style="margin-top:18px"><button class="btn" id="save">추가하기</button><button class="btn-secondary" id="cancel" hidden>취소</button></div>
    </div>
    <details class="panel">
      <summary>여러 곡 한 번에 추가</summary>
      <p class="hint">한 줄에 한 곡씩: <code>링크 | 정답 | 다른정답1, 다른정답2 | 시작지점 | 원래 제목 | 가수 | 길이</code><br>
      정답 뒤는 모두 생략해도 돼요. 정답을 비우면 영상 제목에서 자동으로 가져와요.</p>
      <textarea id="bulk" rows="7" style="margin-top:10px" placeholder="https://youtu.be/CnlMTBwsBHs | 무희 | 오도리코, 踊り子 | | 踊り子 | Vaundy | 3:51"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="bulkAdd">한 번에 추가</button><span id="bulkMsg" class="hint" style="margin:0"></span></div>
    </details>
    <div class="panel">
      <h3>곡 목록 <span id="cnt"></span></h3>
      <div id="songs" class="hint">불러오는 중…</div>
    </div>
    <div class="panel">
      <h3>문제 설정</h3>
      <label class="field">문제 이름</label>
      <div class="row nowrap"><input type="text" id="rename" class="grow" maxlength="40"><button class="btn-secondary" id="renameBtn">변경</button></div>
      <label class="field">장르</label>
      <div class="row nowrap"><input type="text" id="regenre" class="grow" maxlength="12" list="genres2"><button class="btn-secondary" id="regenreBtn">변경</button></div>
      ${genreDatalist("genres2")}
      <label class="field">편집 비밀번호</label>
      <div class="row nowrap"><input type="password" id="newPw" class="grow" placeholder="새 비밀번호"><button class="btn-secondary" id="pwBtn">변경</button></div>
      <div style="margin-top:18px"><button class="filter-btn danger" id="delPl">문제 삭제</button></div>
    </div>` : `
    <div class="panel lift">
      <h3>🔒 편집하려면 비밀번호를 입력하세요</h3>
      <p class="hint" style="margin-bottom:12px">정답 스포를 막으려고 곡 목록은 편집 권한이 있을 때만 보여요.</p>
      <div class="row nowrap"><input type="password" id="pw" class="grow" placeholder="편집 비밀번호"><button class="btn" id="unlock">확인</button></div>
    </div>`}
  </div>`;

  let meta = null;
  let deleted = false;
  onCleanup(onValue(metaRef, s => {
    meta = s.val();
    if (!$("#title")) return;
    if (!meta) { $("#title").textContent = "없는 문제예요"; $("#info").textContent = ""; return; }
    $("#title").textContent = meta.name;
    $("#info").textContent = `${meta.genre || "기타"} · ${meta.count || 0}곡 · 만든 사람 ${meta.createdBy || "익명"}`;
    const rn = $("#rename"), rg = $("#regenre");
    if (rn && document.activeElement !== rn) rn.value = meta.name;
    if (rg && document.activeElement !== rg) rg.value = meta.genre || "";
  }));

  $("#playBtn").onclick = async () => {
    if (!meta) return;
    if (!getName()) { const n = prompt("닉네임을 입력해 주세요"); if (!n || !n.trim()) return; setName(n); }
    if (!meta.count) return toast("곡을 먼저 넣어 주세요");
    try { await createRoom(pid, meta.count); } catch (e) { console.error(e); toast("방을 만들지 못했어요"); }
  };

  if (!unlocked) {
    const tryUnlock = async () => {
      const m = (await get(metaRef)).val();
      if (!m) return toast("없는 문제예요");
      if (await hashPw(pid, $("#pw").value) === m.pwHash) {
        sessionStorage.setItem("unlock_" + pid, "1");
        route();
      } else toast("비밀번호가 달라요");
    };
    $("#unlock").onclick = tryUnlock;
    $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
    return;
  }

  // ----- 곡 목록 -----
  let songs = {};
  function renderSongs() {
    const arr = Object.entries(songs).sort((a, b) => (a[0] < b[0] ? -1 : 1));
    $("#cnt").textContent = `· ${arr.length}곡`;
    $("#songs").innerHTML = arr.length ? arr.map(([sid, s], i) => `
      <div class="song">
        <span class="num">${i + 1}</span>
        <img src="https://i.ytimg.com/vi/${esc(s.videoId)}/mqdefault.jpg" alt="" loading="lazy">
        <div class="txt">
          <b>${esc(s.answer)}</b>
          ${s.alts ? `<span class="sub">다른 정답: ${esc(s.alts)}</span>` : ""}
          <span class="sub">${s.start > 0 ? fmtTime(s.start) + "부터" : "랜덤 구간"} ·
            <a class="link" href="https://youtu.be/${esc(s.videoId)}${s.start > 0 ? "?t=" + Math.floor(s.start) : ""}" target="_blank" rel="noopener">${esc([s.orig || s.title, s.artist].filter(Boolean).join(" · ") || "YouTube")}</a></span>
        </div>
        <div class="row nowrap">
          <button class="btn-secondary" data-edit="${esc(sid)}" style="padding:5px 10px">수정</button>
          <button class="filter-btn danger" data-del="${esc(sid)}">삭제</button>
        </div>
      </div>`).join("") : `<span class="hint">아직 곡이 없어요. 위에서 추가해 보세요.</span>`;
  }
  onCleanup(onValue(songsRef, s => {
    songs = s.val() || {};
    if (!$("#songs")) return;
    renderSongs();
    const n = Object.keys(songs).length;
    if (!deleted && meta && meta.count !== n) update(metaRef, { count: n });
  }));

  // ----- 미리보기 플레이어 -----
  let pvStop = null;
  const pv = await createPlayer("pv", { controls: 1, onError: () => toast(EMBED_BLOCKED + ". 다른 영상을 써 주세요") });
  if (my !== viewId) { try { pv.destroy(); } catch {} return; }
  onCleanup(() => { clearTimeout(pvStop); try { pv.destroy(); } catch {} });

  let cur = { sid: null, videoId: null, title: "" };

  async function loadUrl() {
    const p = parseYouTube($("#url").value);
    if (!p) return toast("YouTube 링크를 확인해 주세요");
    if (p.id === cur.videoId) return;
    cur.videoId = p.id;
    cur.title = "";
    if (p.t != null && !$("#start").value) $("#start").value = fmtTime(p.t);
    pv.cueVideoById({ videoId: p.id, startSeconds: parseTime($("#start").value) || 0 });
    $("#pvCover").classList.add("hide");
    if (!cur.sid && Object.values(songs).some(s => s.videoId === p.id)) toast("이미 목록에 있는 영상이에요");
    const t = await fetchTitle(p.id);
    if (cur.videoId !== p.id) return;
    cur.title = t.title;
    if (t.title && !$("#answer").value) $("#answer").value = guessAnswer(t.title);
    if (t.artist && !$("#artist").value) $("#artist").value = t.artist;
  }

  function resetForm() {
    cur = { sid: null, videoId: null, title: "" };
    ["#url", "#answer", "#alts", "#start", "#orig", "#artist"].forEach(s => { $(s).value = ""; });
    clearTimeout(pvStop);
    try { pv.stopVideo(); } catch {}
    $("#pvCover").classList.remove("hide");
    $("#formTitle").textContent = "곡 추가";
    $("#save").textContent = "추가하기";
    $("#cancel").hidden = true;
  }

  $("#load").onclick = loadUrl;
  $("#url").addEventListener("change", loadUrl);
  $("#url").addEventListener("keydown", e => { if (e.key === "Enter") loadUrl(); });

  $("#setNow").onclick = () => {
    if (!cur.videoId) return toast("먼저 영상을 불러와 주세요");
    $("#start").value = fmtTime(pv.getCurrentTime());
  };

  $("#previewBtn").onclick = () => {
    if (!cur.videoId) return toast("먼저 영상을 불러와 주세요");
    const s = parseTime($("#start").value);
    if (isNaN(s)) return toast("시작 지점은 1:23처럼 써 주세요");
    clearTimeout(pvStop);
    pv.seekTo(s, true);
    pv.playVideo();
    pvStop = setTimeout(() => { try { pv.pauseVideo(); } catch {} }, 10000);
  };

  $("#cancel").onclick = resetForm;

  $("#save").onclick = async () => {
    const p = parseYouTube($("#url").value);
    if (!p) return toast("YouTube 링크를 확인해 주세요");
    const answer = $("#answer").value.trim();
    if (!answer) return toast("정답을 입력해 주세요");
    const start = parseTime($("#start").value);
    if (isNaN(start)) return toast("시작 지점은 1:23처럼 써 주세요");
    if (p.id !== cur.videoId) { cur.videoId = p.id; cur.title = (await fetchTitle(p.id)).title; }
    let len = 0;
    try { len = Math.floor(pv.getDuration() || 0); } catch {}
    const data = {
      videoId: p.id, answer, alts: cleanAlts($("#alts").value), start: Math.floor(start),
      title: cur.title || "", orig: $("#orig").value.trim(), artist: $("#artist").value.trim()
    };
    if (len) data.len = len;
    const wasEdit = !!cur.sid;
    $("#save").disabled = true;
    try {
      if (wasEdit) await update(ref(db, `playlistSongs/${pid}/${cur.sid}`), data);
      else await set(push(songsRef), { ...data, addedAt: serverTimestamp() });
      await update(metaRef, { updatedAt: serverTimestamp() });
      resetForm();
      toast(wasEdit ? "수정했어요" : "추가했어요");
    } catch (e) {
      console.error(e);
      toast("저장하지 못했어요");
    }
    $("#save").disabled = false;
  };

  $("#songs").addEventListener("click", async e => {
    const editId = e.target.dataset.edit;
    const delId = e.target.dataset.del;
    if (editId && songs[editId]) {
      const s = songs[editId];
      cur = { sid: editId, videoId: s.videoId, title: s.title || "" };
      $("#url").value = "https://youtu.be/" + s.videoId;
      $("#answer").value = s.answer || "";
      $("#alts").value = s.alts || "";
      $("#orig").value = s.orig || "";
      $("#artist").value = s.artist || "";
      $("#start").value = s.start > 0 ? fmtTime(s.start) : "";
      pv.cueVideoById({ videoId: s.videoId, startSeconds: s.start || 0 });
      $("#pvCover").classList.add("hide");
      $("#formTitle").textContent = "곡 수정";
      $("#save").textContent = "수정 저장";
      $("#cancel").hidden = false;
      $("#formCard").scrollIntoView({ behavior: "smooth" });
    }
    if (delId && songs[delId]) {
      if (!confirm(`'${songs[delId].answer}'을(를) 삭제할까요?`)) return;
      await set(ref(db, `playlistSongs/${pid}/${delId}`), null);
      if (cur.sid === delId) resetForm();
      toast("삭제했어요");
    }
  });

  // ----- 한 번에 추가 -----
  $("#bulkAdd").onclick = async () => {
    const lines = $("#bulk").value.split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) return toast("추가할 줄을 입력해 주세요");
    $("#bulkAdd").disabled = true;
    let ok = 0;
    const failed = [];
    const updates = {};
    for (const line of lines) {
      if (my !== viewId) return;
      const parts = line.split("|").map(x => x.trim());
      const p = parseYouTube(parts[0]);
      if (!p) { failed.push(line); continue; }
      let title = "", artist = parts[5] || "";
      if (!parts[1] || !artist) {
        const t = await fetchTitle(p.id);
        title = t.title;
        artist = artist || t.artist;
      }
      const answer = parts[1] || guessAnswer(title);
      if (!answer) { failed.push(line); continue; }
      let start = parts[3] ? parseTime(parts[3]) : (p.t || 0);
      if (isNaN(start)) start = 0;
      const len = parts[6] ? parseTime(parts[6]) : 0;
      const song = { videoId: p.id, answer, alts: cleanAlts(parts[2]), start: Math.floor(start), title, orig: parts[4] || "", artist, addedAt: serverTimestamp() };
      if (len > 0) song.len = Math.floor(len);
      updates[push(songsRef).key] = song;
      ok++;
      if (ok % 20 === 0) $("#bulkMsg").textContent = `${ok} / ${lines.length} 준비 중…`;
    }
    if (ok) {
      $("#bulkMsg").textContent = `${ok}곡 저장 중…`;
      await update(songsRef, updates);
      await update(metaRef, { updatedAt: serverTimestamp() });
    }
    $("#bulk").value = failed.join("\n");
    $("#bulkMsg").textContent = `${ok}곡 추가했어요` + (failed.length ? ` · ${failed.length}줄은 링크나 정답을 확인해 주세요 (입력칸에 남겨 뒀어요)` : "");
    $("#bulkAdd").disabled = false;
  };

  // ----- 문제 설정 -----
  $("#renameBtn").onclick = async () => {
    const name = $("#rename").value.trim();
    if (!name) return toast("이름을 입력해 주세요");
    await update(metaRef, { name, updatedAt: serverTimestamp() });
    toast("이름을 바꿨어요");
  };
  $("#regenreBtn").onclick = async () => {
    await update(metaRef, { genre: $("#regenre").value.trim(), updatedAt: serverTimestamp() });
    toast("장르를 바꿨어요");
  };
  $("#pwBtn").onclick = async () => {
    const pw = $("#newPw").value;
    if (!pw) return toast("새 비밀번호를 입력해 주세요");
    await update(metaRef, { pwHash: await hashPw(pid, pw) });
    $("#newPw").value = "";
    toast("비밀번호를 바꿨어요");
  };
  $("#delPl").onclick = async () => {
    if (!confirm("이 문제와 안에 있는 곡을 모두 삭제할까요? 되돌릴 수 없어요.")) return;
    deleted = true;
    await update(ref(db), { ["playlistMeta/" + pid]: null, ["playlistSongs/" + pid]: null });
    sessionStorage.removeItem("unlock_" + pid);
    location.hash = "#/";
  };
}

// ============================================================
//  게임 방
// ============================================================
async function viewRoom(code) {
  const my = viewId;

  if (!getName()) {
    app.innerHTML = hero(`방 ${esc(code)} 들어가기`, "친구들에게 보일 닉네임을 정해 주세요", { back: true, small: true }) + `
    <div class="container narrow"><div class="panel lift">
      <div class="row nowrap"><input type="text" id="nick" class="grow" maxlength="12" placeholder="닉네임"><button class="btn" id="go">입장</button></div>
    </div></div>`;
    const go = () => {
      const n = $("#nick").value.trim();
      if (!n) return toast("닉네임을 입력해 주세요");
      setName(n);
      route();
    };
    $("#go").onclick = go;
    $("#nick").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) go(); });
    $("#nick").focus();
    return;
  }

  app.innerHTML = hero("방에 들어가는 중…", "", { small: true });
  const base = "rooms/" + code;
  const roomRef = ref(db, base);
  const stateRef = ref(db, base + "/state");
  const meRef = ref(db, `${base}/players/${uid}`);
  const onlineRef = ref(db, `${base}/players/${uid}/online`);

  let exists = false;
  try { exists = (await get(roomRef)).exists(); } catch (e) { console.error(e); }
  if (my !== viewId) return;
  if (!exists) {
    app.innerHTML = hero("방을 찾을 수 없어요", `방 코드 <b>${esc(code)}</b>를 다시 확인해 주세요`, { back: true, small: true });
    return;
  }

  const me = (await get(meRef)).val();
  if (me) await update(meRef, { name: getName(), online: true });
  else await set(meRef, { name: getName(), score: 0, online: true, joinedAt: serverTimestamp() });
  if (my !== viewId) return;

  onCleanup(onValue(ref(db, ".info/connected"), s => {
    if (s.val()) { onDisconnect(onlineRef).set(false); set(onlineRef, true); }
  }));
  onCleanup(() => { onDisconnect(onlineRef).cancel(); set(onlineRef, false); });

  app.innerHTML = `
  <header class="hero small">
    <a href="#/" class="back">← 문제 목록 (방 나가기)</a><br>
    <h1 id="roomTitle">노래 맞히기</h1>
    <p id="roomSub"></p>
    <div class="room-code">방 코드 <b>${esc(code)}</b><button id="copy">초대 링크 복사</button></div>
  </header>
  <div class="container">
    <div class="room-grid">
      <div>
        <div class="video-box"><div id="yt"></div><div class="cover" id="cover"></div></div>
        <div class="panel status" id="status"></div>
        <div id="controls"></div>
        <div class="panel">
          <div class="row nowrap">
            <input type="text" id="gIn" class="grow" placeholder="정답이나 채팅을 입력하세요" maxlength="60" autocomplete="off">
            <button class="btn" id="gSend">보내기</button>
          </div>
          <div id="feed" class="feed"></div>
        </div>
      </div>
      <aside>
        <div class="panel"><h3>🏆 점수판</h3><ul id="players" class="players"></ul></div>
        <div class="panel">
          <h3>🔊 볼륨</h3>
          <input type="range" id="vol" min="0" max="100">
          <p class="hint">노래가 안 들리면 아래 버튼을 눌러 주세요. 아이폰은 처음 한 번 눌러야 할 수 있어요.</p>
          <button class="btn-secondary" id="resync" style="margin-top:10px">🔄 소리 다시 맞추기</button>
        </div>
      </aside>
    </div>
  </div>`;

  $("#copy").onclick = async () => {
    const link = location.href.split("#")[0] + "#/room/" + code;
    try { await navigator.clipboard.writeText(link); toast("초대 링크를 복사했어요"); }
    catch { prompt("이 링크를 복사해서 보내 주세요", link); }
  };

  // ----- 플레이어 -----
  let room = null;
  let curVideo = null;
  const player = await createPlayer("yt", {
    onError: () => toast(EMBED_BLOCKED + (room && room.host === uid ? ". '정답 공개'로 넘어가 주세요" : ""))
  });
  if (my !== viewId) { try { player.destroy(); } catch {} return; }
  onCleanup(() => { try { player.destroy(); } catch {} });

  const vol = () => +(localStorage.getItem("vol") ?? 80);
  $("#vol").value = vol();
  $("#vol").addEventListener("input", e => {
    localStorage.setItem("vol", e.target.value);
    try { player.setVolume(+e.target.value); } catch {}
  });

  let startT = null, stopT = null;
  const clearPlayTimers = () => { clearTimeout(startT); clearTimeout(stopT); };
  onCleanup(clearPlayTimers);

  const clipMs = () => (room?.settings?.clipLen || 15) * 1000;
  const startOf = song => {
    let d = 0;
    try { d = player.getDuration() || 0; } catch {}
    return pickStart(song, room?.settings?.startMode || "auto", d);
  };

  function playFrom(song, elapsedMs) {
    const clip = clipMs();
    if (elapsedMs >= clip) { try { player.pauseVideo(); } catch {} return; }
    player.seekTo(startOf(song) + elapsedMs / 1000, true);
    player.unMute();
    player.setVolume(vol());
    player.playVideo();
    clearTimeout(stopT);
    stopT = setTimeout(() => { try { player.pauseVideo(); } catch {} }, clip - elapsedMs);
  }

  function schedulePlay(song, startAt) {
    if (now() - startAt >= clipMs()) { try { player.stopVideo(); } catch {} return; }
    // 카운트다운 동안 음소거 상태로 미리 불러와 둠
    player.mute();
    player.loadVideoById({ videoId: song.videoId, startSeconds: startOf(song) });
    curVideo = song.videoId;
    startT = setTimeout(() => playFrom(song, Math.max(0, now() - startAt)), Math.max(0, startAt - now()));
  }

  function playReveal(song) {
    const s = startOf(song);
    if (curVideo === song.videoId) player.seekTo(s, true);
    else { player.loadVideoById({ videoId: song.videoId, startSeconds: s }); curVideo = song.videoId; }
    player.unMute();
    player.setVolume(vol());
    player.playVideo();
  }

  let lastKey = null;
  function handlePlayback() {
    const st = room.state || {};
    const key = [st.phase, st.index, st.playId].join("|");
    if (key === lastKey) return;
    lastKey = key;
    clearPlayTimers();
    const song = room.songs?.[st.index];
    try {
      if (st.phase === "playing" && song) schedulePlay(song, st.startAt);
      else if (st.phase === "reveal" && song) playReveal(song);
      else player.stopVideo();
    } catch (e) { console.error(e); }
  }

  $("#resync").onclick = () => {
    const st = room?.state || {};
    const song = room?.songs?.[st.index];
    try {
      if (st.phase === "playing" && song) {
        const el = now() - st.startAt;
        if (el < 0) return toast("곧 시작해요");
        if (el >= clipMs()) return toast("이번 곡 재생은 끝났어요");
        clearPlayTimers();
        playFrom(song, el);
      } else if (st.phase === "reveal" && song) {
        player.unMute(); player.setVolume(vol()); player.playVideo();
      } else toast("노래가 나올 때 눌러 주세요");
    } catch (e) { console.error(e); }
  };

  // ----- 방 데이터 구독 -----
  let playlists = {};
  onCleanup(onValue(ref(db, "playlistMeta"), s => { playlists = s.val() || {}; if (room) { renderHeader(); renderControls(true); } }));
  onCleanup(onValue(roomRef, s => {
    room = s.val();
    if (!room) {
      app.innerHTML = hero("방이 사라졌어요", "", { back: true, small: true });
      return;
    }
    renderHeader();
    renderPlayers();
    renderFeed();
    renderStage();
    renderControls();
    handlePlayback();
  }));
  const tick = setInterval(() => { if (room && room.state?.phase === "playing") renderStage(); }, 250);
  onCleanup(() => clearInterval(tick));

  const isHost = () => room && room.host === uid;
  const myName = () => getName() || "익명";

  let lastHeader = null;
  function renderHeader() {
    const m = playlists[room.settings?.playlistId];
    const sig = m ? m.name + "|" + m.genre + "|" + m.count : "";
    if (sig === lastHeader) return;
    lastHeader = sig;
    $("#roomTitle").textContent = m ? m.name : "노래 맞히기";
    $("#roomSub").textContent = m ? `${m.genre || "기타"} · ${m.count || 0}곡` : "";
    document.title = (m ? m.name + " · " : "") + "노래 맞히기";
  }
  onCleanup(() => { document.title = "노래 맞히기"; });

  function sortedPlayers() {
    return Object.entries(room.players || {}).sort((a, b) =>
      (b[1].score || 0) - (a[1].score || 0) || (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
  }

  function renderPlayers() {
    $("#players").innerHTML = sortedPlayers().map(([id, p], i) => `
      <li class="${p.online ? "" : "off"}">
        <span class="rk">${i + 1}</span>
        <span class="nm">${id === room.host ? "👑 " : ""}${esc(p.name)}${id === uid ? " <span class='hint'>(나)</span>" : ""}</span>
        <span class="sc">${p.score || 0}</span>
      </li>`).join("");
  }

  let lastFeedKey = null;
  function renderFeed() {
    const items = Object.entries(room.feed || {}).sort((a, b) => (a[0] < b[0] ? -1 : 1)).slice(-60);
    const key = items.length ? items[items.length - 1][0] + items.length : "";
    if (key === lastFeedKey) return;
    lastFeedKey = key;
    const el = $("#feed");
    el.innerHTML = items.length ? items.map(([, f]) => {
      if (f.t === "ok") return `<div class="ok">🎉 ${esc(f.name)}님 정답!</div>`;
      if (f.t === "sys") return `<div class="sys">${esc(f.text)}</div>`;
      return `<div><b>${esc(f.name)}</b> ${esc(f.text)}</div>`;
    }).join("") : `<div class="sys">정답을 입력하면 가장 먼저 맞힌 사람이 1점을 얻어요.</div>`;
    el.scrollTop = el.scrollHeight;
  }

  let lastCover = null, lastStatus = null;
  function setStage(cover, status, hideCover = false) {
    const c = $("#cover");
    c.classList.toggle("hide", hideCover);
    if (cover !== lastCover) { c.innerHTML = cover; lastCover = cover; }
    if (status !== lastStatus) { $("#status").innerHTML = status; lastStatus = status; }
  }

  const MODE_LABEL = { auto: "정한 곳 (없으면 랜덤)", start: "처음부터", random: "랜덤 구간" };

  function renderStage() {
    const st = room.state || { phase: "lobby" };
    const total = room.songs?.length || 0;
    const song = room.songs?.[st.index];
    const s = room.settings || {};
    const m = playlists[s.playlistId];
    $("#cover").style.background = m ? genreColor(m.genre) : "";

    if (st.phase === "lobby") {
      const n = Object.keys(room.players || {}).length;
      setStage(
        `<div class="big">🎧</div><div class="cv-sub">방장이 게임을 시작하면 노래가 나와요</div>`,
        `<span class="step">대기 중 · ${n}명 참가</span>
         <div class="orig">${m ? `${esc(m.name)} · ` : ""}${s.count || 10}곡 · 곡당 ${s.clipLen || 15}초 · ${MODE_LABEL[s.startMode || "auto"]}</div>`
      );
    } else if (st.phase === "playing") {
      const t = now(), clip = clipMs();
      const step = `<span class="step">${st.index + 1} / ${total}</span>`;
      if (t < st.startAt) {
        setStage(`<div class="cv-sub">${st.index + 1}번째 곡</div><div class="big">${Math.ceil((st.startAt - t) / 1000)}</div>`,
          `${step}<div>곧 시작해요</div>`);
      } else if (t < st.startAt + clip) {
        setStage(`<div class="eq"><span></span><span></span><span></span><span></span><span></span></div><div class="cv-sub">${Math.ceil((st.startAt + clip - t) / 1000)}초</div>`,
          `${step}<div><b>듣는 중!</b> 정답을 입력하세요</div>`);
      } else {
        setStage(`<div class="big">?</div><div class="cv-sub">무슨 노래일까요?</div>`,
          `${step}<div>재생이 끝났어요. 계속 맞혀 보세요</div>`);
      }
    } else if (st.phase === "reveal" && song) {
      const sub = [song.orig && norm(song.orig) !== norm(song.answer) ? song.orig : "", song.artist].filter(Boolean).join(" · ");
      setStage("",
        `<span class="step">${st.index + 1} / ${total} 정답</span>
         <div class="answer">${esc(song.answer)}</div>
         ${sub ? `<div class="orig">${esc(sub)}</div>` : ""}
         ${st.winnerName ? `<div class="win">🎉 ${esc(st.winnerName)}님이 맞혔어요!</div>` : `<div class="orig" style="margin-top:4px">아무도 못 맞혔어요</div>`}`,
        true);
    } else if (st.phase === "end") {
      const ranks = sortedPlayers();
      const top = ranks[0]?.[1];
      setStage(`<div class="big">🏆</div><div class="cv-sub">${top ? esc(top.name) + "님 우승!" : "게임 끝!"}</div>`,
        `<span class="step">최종 결과</span><div style="margin-top:6px">${ranks.map(([, p], i) =>
          `<div>${["🥇", "🥈", "🥉"][i] || i + 1 + "."} ${esc(p.name)} · <b>${p.score || 0}점</b></div>`).join("")}</div>`);
    }
  }

  // ----- 방장 컨트롤 -----
  let lastCtrlSig = null;
  function renderControls(force = false) {
    const st = room.state || { phase: "lobby" };
    const host = isHost();
    const hostOnline = !!room.players?.[room.host]?.online;
    const sig = JSON.stringify([st.phase, st.index, room.songs?.length, host, hostOnline, room.settings]);
    if (!force && sig === lastCtrlSig) return;
    lastCtrlSig = sig;
    const el = $("#controls");

    if (!host) {
      el.innerHTML = hostOnline ? "" :
        `<div class="ctl"><span class="hint" style="margin:0">방장이 나갔어요.</span><button class="btn" data-act="takeover">내가 방장 하기</button></div>`;
      return;
    }

    if (st.phase === "lobby") {
      const s = room.settings || {};
      const opts = Object.entries(playlists)
        .sort((a, b) => String(a[1].genre || "").localeCompare(String(b[1].genre || ""), "ko") || String(a[1].name).localeCompare(String(b[1].name), "ko"))
        .map(([id, m]) => `<option value="${esc(id)}" ${id === s.playlistId ? "selected" : ""}>${m.genre ? `[${esc(m.genre)}] ` : ""}${esc(m.name)} (${m.count || 0}곡)</option>`).join("");
      el.innerHTML = `
      <div class="panel" style="margin-top:0;margin-bottom:16px">
        <h3>⚙️ 게임 설정 <span class="hint">(방장)</span></h3>
        <div class="settings">
          <div style="grid-column:1/-1"><label class="field">문제</label><select id="setPl"><option value="">고르세요</option>${opts}</select></div>
          <div><label class="field">곡 수</label><input id="setCount" type="number" min="1" max="100" value="${s.count || 10}"></div>
          <div><label class="field">곡당 재생</label><select id="setClip">${[5, 10, 15, 20, 30].map(v => `<option value="${v}" ${v === (s.clipLen || 15) ? "selected" : ""}>${v}초</option>`).join("")}</select></div>
          <div style="grid-column:1/-1"><label class="field">재생 구간</label><select id="setMode">${Object.entries(MODE_LABEL).map(([k, v]) => `<option value="${k}" ${k === (s.startMode || "auto") ? "selected" : ""}>${v}</option>`).join("")}</select></div>
        </div>
        <div class="ctl" style="margin:16px 0 0"><button class="btn" data-act="start">게임 시작</button></div>
      </div>`;
      $("#setPl").onchange = e => update(ref(db, base + "/settings"), { playlistId: e.target.value });
      $("#setCount").onchange = e => update(ref(db, base + "/settings"), { count: Math.min(100, Math.max(1, parseInt(e.target.value) || 10)) });
      $("#setClip").onchange = e => update(ref(db, base + "/settings"), { clipLen: +e.target.value });
      $("#setMode").onchange = e => update(ref(db, base + "/settings"), { startMode: e.target.value });
    } else if (st.phase === "playing") {
      el.innerHTML = `<div class="ctl"><button class="btn-secondary" data-act="replay">🔁 다시 듣기</button><button class="btn-secondary" data-act="reveal">정답 공개</button></div>`;
    } else if (st.phase === "reveal") {
      const last = st.index + 1 >= (room.songs?.length || 0);
      el.innerHTML = `<div class="ctl"><button class="btn" data-act="next">${last ? "결과 보기 🏆" : "다음 곡 ▶"}</button></div>`;
    } else if (st.phase === "end") {
      el.innerHTML = `<div class="ctl"><button class="btn" data-act="again">다시 하기</button><a class="btn-secondary" href="#/">다른 문제 고르기</a></div>`;
    }
  }

  $("#controls").addEventListener("click", async e => {
    const act = e.target.dataset?.act;
    if (!act) return;
    const st = room.state || {};
    try {
      if (act === "takeover") {
        await update(roomRef, { host: uid });
        await push(ref(db, base + "/feed"), { t: "sys", text: `${myName()}님이 방장이 됐어요` });
      } else if (act === "start") {
        await startGame();
      } else if (act === "replay") {
        await update(stateRef, { startAt: now() + 2500, playId: rid() });
      } else if (act === "reveal") {
        await runTransaction(stateRef, s => {
          if (!s || s.phase !== "playing") return;
          s.phase = "reveal";
          return s;
        });
      } else if (act === "next") {
        const i = st.index + 1;
        if (i < (room.songs?.length || 0)) await set(stateRef, { phase: "playing", index: i, startAt: now() + 3500, playId: rid() });
        else await set(stateRef, { phase: "end" });
      } else if (act === "again") {
        await set(stateRef, { phase: "lobby" });
      }
    } catch (err) {
      console.error(err);
      toast("처리하지 못했어요. 잠시 후 다시 눌러 주세요");
    }
  });

  async function startGame() {
    const s = room.settings || {};
    if (!s.playlistId) return toast("문제를 골라 주세요");
    const all = Object.values((await get(ref(db, "playlistSongs/" + s.playlistId))).val() || {});
    if (!all.length) return toast("이 문제에는 곡이 없어요");
    // rf: 랜덤 구간 위치 (곡 길이의 20~65% 지점). 모든 참가자가 같은 값을 써서 같은 구간을 들어요.
    const songs = shuffle(all).slice(0, Math.min(s.count || 10, all.length)).map(x => ({
      videoId: x.videoId, start: x.start || 0, len: x.len || 0, rf: +(0.2 + Math.random() * 0.45).toFixed(3),
      answer: x.answer, alts: x.alts || "", orig: x.orig || "", artist: x.artist || ""
    }));
    const updates = { songs, feed: null, state: { phase: "playing", index: 0, startAt: now() + 4000, playId: rid() } };
    for (const id of Object.keys(room.players || {})) updates[`players/${id}/score`] = 0;
    await update(roomRef, updates);
    await push(ref(db, base + "/feed"), { t: "sys", text: `게임 시작! 총 ${songs.length}곡이에요` });
  }

  // ----- 정답/채팅 입력 -----
  async function send() {
    const input = $("#gIn");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    const st = room.state || {};
    const song = room.songs?.[st.index];
    if (st.phase === "playing" && song && isCorrect(text, song)) {
      const res = await runTransaction(stateRef, s => {
        if (!s || s.phase !== "playing" || s.winner || s.index !== st.index) return;
        s.winner = uid;
        s.winnerName = myName();
        s.phase = "reveal";
        return s;
      });
      if (res.committed) {
        await runTransaction(ref(db, `${base}/players/${uid}/score`), v => (v || 0) + 1);
        await push(ref(db, base + "/feed"), { t: "ok", name: myName() });
      } else {
        toast("아쉽게 한 발 늦었어요!");
      }
    } else {
      await push(ref(db, base + "/feed"), { t: "chat", name: myName(), text: text.slice(0, 60) });
    }
  }
  $("#gSend").onclick = send;
  $("#gIn").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
  });
}

route();
</script>
</body>
</html>
